name: Fix Kaggle Results Control Flow

on:
  push:
    paths:
      - .github/workflows/_fix-kaggle-results-controlflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Guard validation on terminal completion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/kaggle-results.yml')
          s = p.read_text(encoding='utf-8')
          marker = '      - name: Validate completed training artifacts\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Validation step not found; refusing to modify workflow')
          run_marker = '        run: |\n'
          run_start = s.find(run_marker, start)
          if run_start < 0:
              raise SystemExit('Validation run block not found')
          body_start = run_start + len(run_marker)
          next_step = s.find('\n      - name:', body_start)
          if next_step < 0:
              raise SystemExit('Next workflow step not found')
          body = s[body_start:next_step]
          if 'STATUS=$(tr -d' in body and 'Skipping validation because Kaggle status' in body:
              print('Validation guard already present; nothing to change.')
          else:
              guard = '''          STATUS=$(tr -d '\\r\\n ' < ".training-manifests/${{ matrix.slug }}/status.txt" 2>/dev/null || true)\n          if [ "$STATUS" != "complete" ]; then\n            echo "Skipping validation because Kaggle status is ${STATUS:-unknown}."\n            exit 0\n          fi\n'''
              needle = '          ROOT="artifacts/${{ matrix.slug }}"\n'
              if needle not in body:
                  raise SystemExit('Expected ROOT line not found; refusing to modify workflow')
              body = body.replace(needle, needle + guard, 1)
              s = s[:body_start] + body + s[next_step:]
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/kaggle-results.yml
          if git diff --cached --quiet; then
            echo 'No workflow change required.'
            exit 0
          fi
          git commit -m 'fix: skip Kaggle validation while kernels run'
          git push
