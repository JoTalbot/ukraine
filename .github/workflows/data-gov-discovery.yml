name: Ukraine Open Data Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/data_gov_ua_discovery.py'
      - '.github/workflows/data-gov-discovery.yml'
      - 'config/ukraine_open_data_catalog.json'

permissions:
  contents: read

concurrency:
  group: ukraine-open-data-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Test discovery
        run: pytest -q tests/test_data_gov_discovery.py

      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 500

      - name: Validate curated catalog
        run: python -m json.tool config/ukraine_open_data_catalog.json >/dev/null

      - name: Run summary
        if: ${{ always() }}
        run: |
          if [ -f artifacts/discovery/data_gov_ua_catalog.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('artifacts/discovery/data_gov_ua_catalog.json', encoding='utf-8') as fh:
              data = json.load(fh)
          datasets = data.get('datasets', [])
          print(f'## Discovery: {len(datasets)} datasets')
          print('')
          print('Discovery catalog generated successfully; publication is handled by the downstream HF workflow.')
          PY
          else
            echo 'Discovery catalog was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write ingestion status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="data.gov.ua discovery workflow completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal ingestion --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/discovery/data_gov_ua_catalog.json

      - name: Upload ingestion status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-ingestion
          path: artifacts/status/signals/ingestion.json
          if-no-files-found: error
          retention-days: 30
