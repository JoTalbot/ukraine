name: Ukraine Open Data Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/data_gov_ua_discovery.py'
      - '.github/workflows/data-gov-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 500

      - name: Run summary
        if: ${{ always() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '> каталог не создан (шаг discovery упал до записи файла)' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('artifacts/discovery/data_gov_ua_catalog.json', encoding='utf-8') as fh:
              data = json.load(fh)
          n = len(data.get('datasets', []))
          top = data.get('datasets', [])[:10]
          print(f'## Discovery: {n} datasets\n')
          print('| # | dataset | org |')
          print('|---|---|---|')
          for i, d in enumerate(top, 1):
              print(f"| {i} | [{d.get('name','')[:60]}]({d.get('url','')}) | {(d.get('organization') or '')[:40]} |")
          if n > len(top):
              print(f'\n_…и ещё {n - len(top)}_')
          PY

      - name: Publish discovery catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/discovery/data_gov_ua_catalog.json
          git diff --cached --quiet || git commit -m 'chore: refresh data.gov.ua discovery catalog'
          git push

      - name: Write ingestion status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="data.gov.ua discovery workflow completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal ingestion --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/discovery/data_gov_ua_catalog.json

      - name: Upload ingestion status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: status-signal-ingestion
          path: artifacts/status/signals/ingestion.json
          if-no-files-found: error
          retention-days: 30
