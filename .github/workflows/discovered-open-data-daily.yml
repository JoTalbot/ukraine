name: Discovered Ukraine Open Data -> Hugging Face Daily Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: read

concurrency:
  group: ukraine-discovered-open-data-daily
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DISCOVERY_BATCH_SIZE: 50

jobs:
  bootstrap-gate:
    name: Check bootstrap completion
    runs-on: ubuntu-24.04
    outputs:
      complete: ${{ steps.check.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read bootstrap progress
        id: check
        run: |
          PROGRESS_FILE=.github/state/discovered-open-data-progress.json
          if [ ! -f "$PROGRESS_FILE" ]; then
            echo 'Bootstrap progress file is absent; daily refresh remains gated.'
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          complete="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.github/state/discovered-open-data-progress.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              print(f'Bootstrap progress is unreadable: {exc}')
              raise SystemExit(2)
          print('true' if data.get('bootstrap_complete') is True else 'false')
          PY
          )"
          echo "bootstrap_complete=$complete"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo 'Bootstrap is not complete; daily refresh will be skipped.'
          fi

  discover:
    name: Discover current catalog
    needs: bootstrap-gate
    if: needs.bootstrap-gate.outputs.complete == 'true'
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.matrix.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 0
      - name: Build dynamic batch matrix
        id: matrix
        env:
          CATALOG_FILE: artifacts/discovery/data_gov_ua_catalog.json
          BATCH_SIZE: ${{ env.DISCOVERY_BATCH_SIZE }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path(os.environ['CATALOG_FILE']).read_text(encoding='utf-8'))
          datasets = catalog.get('datasets', catalog) if isinstance(catalog, dict) else catalog
          count = (len(datasets) + int(os.environ['BATCH_SIZE']) - 1) // int(os.environ['BATCH_SIZE'])
          if count < 1:
              raise SystemExit('Discovery catalog contains no datasets')
          batches = json.dumps(list(range(count)), separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'batches={batches}\n')
          print(f'Discovered {len(datasets)} datasets in {count} refresh batches')
          PY
      - name: Upload catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: discovered-open-data-catalog
          path: artifacts/discovery/data_gov_ua_catalog.json
          if-no-files-found: error
          retention-days: 1

  mirror:
    name: Refresh batch ${{ matrix.batch }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: discovered-open-data-catalog
          path: artifacts/discovery
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub
      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          print('Hugging Face authentication OK:', api.whoami().get('name'))
          api.create_repo(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', exist_ok=True, private=False)
          PY
      - name: Mirror daily batch incrementally
        run: |
          python scripts/data_gov_ua_discovered_sync.py \
            --catalog artifacts/discovery/data_gov_ua_catalog.json \
            --dataset-offset "$(( ${{ matrix.batch }} * DISCOVERY_BATCH_SIZE ))" \
            --dataset-limit "$DISCOVERY_BATCH_SIZE" \
            --incremental \
            --max-dataset-files 0 \
            --max-file-mb 0
