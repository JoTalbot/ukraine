name: Discovered Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Dataset batch index (0-based, 50 datasets per batch)'
        required: false
        default: 'auto'
        type: string
  push:
    paths:
      - 'scripts/data_gov_ua_discovered_sync.py'
      - '.github/workflows/discovered-open-data-huggingface.yml'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ukraine-discovered-open-data
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DISCOVERY_BATCH_SIZE: 50
  DISCOVERY_BATCH_COUNT: 73

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub
      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          print('Hugging Face authentication OK:', api.whoami().get('name'))
          api.create_repo(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', exist_ok=True, private=False)
          PY
      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 0
      - name: Select mirror batch
        id: batch
        env:
          REQUESTED_BATCH: ${{ inputs.batch_index }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$REQUESTED_BATCH" ] && [ "$REQUESTED_BATCH" != "auto" ]; then
            batch="$REQUESTED_BATCH"
          else
            batch=$(( (RUN_NUMBER - 1) % DISCOVERY_BATCH_COUNT ))
          fi
          case "$batch" in
            ''|*[!0-9]*) echo "Invalid batch index: $batch"; exit 1 ;;
          esac
          offset=$(( batch * DISCOVERY_BATCH_SIZE ))
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "offset=$offset" >> "$GITHUB_OUTPUT"
          echo "Selected discovered-data batch $batch, offset $offset, size $DISCOVERY_BATCH_SIZE"
      - name: Mirror discovered datasets
        run: |
          python scripts/data_gov_ua_discovered_sync.py \
            --catalog artifacts/discovery/data_gov_ua_catalog.json \
            --dataset-offset "${{ steps.batch.outputs.offset }}" \
            --dataset-limit "$DISCOVERY_BATCH_SIZE" \
            --max-dataset-files 0 \
            --max-file-mb 0
      - name: Write publication status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="discovered open-data mirror completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal publication --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/discovery/data_gov_ua_catalog.json
      - name: Upload publication status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-publication
          path: artifacts/status/signals/publication.json
          if-no-files-found: error
          retention-days: 30
