name: Discovered Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Dataset batch index (0-based, 50 datasets per batch)'
        required: false
        default: 'auto'
        type: string
  push:
    paths:
      - 'scripts/data_gov_ua_discovered_sync.py'
      - '.github/workflows/discovered-open-data-huggingface.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ukraine-discovered-open-data
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DISCOVERY_BATCH_SIZE: 50
  DISCOVERY_BATCH_COUNT: 73
  PROGRESS_FILE: .github/state/discovered-open-data-progress.json

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub
      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          print('Hugging Face authentication OK:', api.whoami().get('name'))
          api.create_repo(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', exist_ok=True, private=False)
          PY
      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 0
      - name: Select next mirror batch
        id: batch
        env:
          REQUESTED_BATCH: ${{ inputs.batch_index }}
          PROGRESS_FILE: ${{ env.PROGRESS_FILE }}
          BATCH_COUNT: ${{ env.DISCOVERY_BATCH_COUNT }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['PROGRESS_FILE'])
          requested = os.environ.get('REQUESTED_BATCH', '')
          count = int(os.environ['BATCH_COUNT'])
          state = {}
          if p.exists():
              state = json.loads(p.read_text(encoding='utf-8'))
          completed = bool(state.get('bootstrap_complete'))
          last_daily = state.get('last_daily_run', 0)
          run_number = int(os.environ['RUN_NUMBER'])
          if requested and requested != 'auto':
              batch = int(requested)
              mode = 'manual'
          elif completed:
              # Bootstrap is complete: only perform the normal daily refresh.
              # The 15-minute schedule remains as a cheap gate so new runs do
              # not require editing the workflow schedule.
              if run_number - int(last_daily) < 96:
                  print('Bootstrap complete and daily refresh is not due yet; exiting cleanly.')
                  Path('artifacts/discovery/skip-mirror').parent.mkdir(parents=True, exist_ok=True)
                  Path('artifacts/discovery/skip-mirror').write_text('daily refresh not due\n', encoding='utf-8')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                      fh.write('skip=true\n')
                      fh.write('batch=0\n')
                      fh.write('offset=0\n')
                  raise SystemExit(0)
              batch = 0
              mode = 'daily'
          else:
              batch = int(state.get('next_batch', 0)) % count
              mode = 'bootstrap'
          offset = batch * int(os.environ.get('DISCOVERY_BATCH_SIZE', '50'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'skip=false\nmode={mode}\nbatch={batch}\noffset={offset}\n')
          print(f'Selected {mode} dataset batch {batch}, offset {offset}')
          PY
      - name: Mirror discovered datasets
        if: steps.batch.outputs.skip != 'true'
        run: |
          python scripts/data_gov_ua_discovered_sync.py \
            --catalog artifacts/discovery/data_gov_ua_catalog.json \
            --dataset-offset "${{ steps.batch.outputs.offset }}" \
            --dataset-limit "$DISCOVERY_BATCH_SIZE" \
            --max-dataset-files 0 \
            --max-file-mb 0
      - name: Persist mirror progress
        if: steps.batch.outputs.skip != 'true'
        env:
          PROGRESS_FILE: ${{ env.PROGRESS_FILE }}
          MODE: ${{ steps.batch.outputs.mode }}
          BATCH: ${{ steps.batch.outputs.batch }}
          BATCH_COUNT: ${{ env.DISCOVERY_BATCH_COUNT }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p "$(dirname "$PROGRESS_FILE")"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['PROGRESS_FILE'])
          state = {}
          if p.exists():
              state = json.loads(p.read_text(encoding='utf-8'))
          mode = os.environ['MODE']
          batch = int(os.environ['BATCH'])
          count = int(os.environ['BATCH_COUNT'])
          run = int(os.environ['RUN_NUMBER'])
          if mode == 'bootstrap':
              nxt = batch + 1
              if nxt >= count:
                  state['bootstrap_complete'] = True
                  state['next_batch'] = count
                  state['last_bootstrap_run'] = run
                  state['completed_batches'] = count
                  print('Initial discovered-data bootstrap is complete.')
              else:
                  state['next_batch'] = nxt
                  state['bootstrap_complete'] = False
                  state['completed_batches'] = nxt
          elif mode == 'daily':
              state['bootstrap_complete'] = True
              state['last_daily_run'] = run
              state['last_daily_batch'] = batch
          state['updated_at_utc'] = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROGRESS_FILE"
          git diff --cached --quiet || git commit -m "chore(data): persist discovered open-data progress"
          git push
      - name: Write publication status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="discovered open-data mirror completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal publication --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/discovery/data_gov_ua_catalog.json
      - name: Upload publication status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-publication
          path: artifacts/status/signals/publication.json
          if-no-files-found: error
          retention-days: 30
