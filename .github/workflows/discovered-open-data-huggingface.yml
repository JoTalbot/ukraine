name: Discovered Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Bootstrap batch index (0-based), or auto"
        required: false
        default: "auto"
  push:
    paths:
      - "scripts/data_gov_ua_discovered_sync.py"
      - "scripts/data_gov_ua_discovery.py"
      - ".github/workflows/discovered-open-data-huggingface.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ukraine-discovered-open-data
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DISCOVERY_BATCH_SIZE: 50
  PROGRESS_FILE: .github/state/discovered-open-data-progress.json

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub

      - name: Verify Hugging Face authentication
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN is not configured")
          api = HfApi(token=token)
          api.whoami()
          api.create_repo(os.environ["HF_DATASET_REPO"], repo_type="dataset", exist_ok=True)
          print("Hugging Face authentication OK")
          PY

      - name: Discover datasets
        run: |
          mkdir -p .github/state
          python scripts/data_gov_ua_discovery.py --output .github/state/discovered-open-data-catalog.json --limit 0

      - name: Select next bootstrap batch
        id: batch
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          catalog = json.loads(Path('.github/state/discovered-open-data-catalog.json').read_text())
          datasets = catalog.get('datasets', catalog if isinstance(catalog, list) else [])
          size = int(os.environ['DISCOVERY_BATCH_SIZE'])
          batch_count = max(1, (len(datasets) + size - 1) // size)

          progress_path = Path(os.environ['PROGRESS_FILE'])
          progress = {}
          if progress_path.exists():
              progress = json.loads(progress_path.read_text())

          if progress.get('bootstrap_complete'):
              print('Bootstrap already complete')
              print(f"::set-output name=skip::true")
              raise SystemExit(0)

          requested = os.environ.get('BATCH_INDEX', 'auto')
          if requested != 'auto':
              index = int(requested)
          else:
              index = int(progress.get('next_batch', 0))

          if index >= batch_count:
              index = max(0, batch_count - 1)

          print(f"Datasets: {len(datasets)}")
          print(f"Batch size: {size}")
          print(f"Batch count: {batch_count}")
          print(f"Selected batch: {index}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"index={index}\n")
              fh.write(f"batch_count={batch_count}\n")
              fh.write("skip=false\n")
          PY
        env:
          BATCH_INDEX: ${{ inputs.batch_index || 'auto' }}

      - name: Mirror discovered datasets
        if: steps.batch.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=60s 150m \
            python scripts/data_gov_ua_discovered_sync.py \
              --catalog .github/state/discovered-open-data-catalog.json \
              --offset $(( ${{ steps.batch.outputs.index }} * DISCOVERY_BATCH_SIZE )) \
              --limit $DISCOVERY_BATCH_SIZE \
              --max-dataset-files 0 \
              --max-file-mb 0 \
              --incremental

      - name: Persist bootstrap progress
        if: success() && steps.batch.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path(os.environ['PROGRESS_FILE'])
          progress = {}
          if p.exists():
              progress = json.loads(p.read_text())

          index = int(os.environ['BATCH_INDEX'])
          batch_count = int(os.environ['BATCH_COUNT'])
          next_batch = index + 1
          progress.update({
              'version': 1,
              'batch_size': int(os.environ['DISCOVERY_BATCH_SIZE']),
              'batch_count': batch_count,
              'last_completed_batch': index,
              'next_batch': next_batch,
              'bootstrap_complete': next_batch >= batch_count,
          })
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(progress, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(progress, ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROGRESS_FILE"
          git diff --cached --quiet || git commit -m "chore(data): persist discovered bootstrap progress"
          git push
        env:
          BATCH_INDEX: ${{ steps.batch.outputs.index }}
          BATCH_COUNT: ${{ steps.batch.outputs.batch_count }}

      - name: Write publication status signal
        if: always()
        run: python scripts/write_status_signal.py --stage publication --status "${{ job.status }}" --run-id "${{ github.run_id }}" --output status-signal-publication.json

      - name: Upload publication status signal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-signal-publication
          path: status-signal-publication.json
          if-no-files-found: error
