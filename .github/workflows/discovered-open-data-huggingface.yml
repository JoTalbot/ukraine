name: Discovered Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Dataset batch index (0-based, 10 datasets per batch)'
        required: false
        default: 'auto'
        type: string
  push:
    paths:
      - 'scripts/data_gov_ua_discovered_sync.py'
      - 'scripts/data_gov_ua_discovery.py'
      - '.github/workflows/discovered-open-data-huggingface.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ukraine-discovered-open-data
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DISCOVERY_BATCH_SIZE: 10
  PROGRESS_FILE: .github/state/discovered-open-data-progress.json

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub
      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          print('Hugging Face authentication OK:', api.whoami().get('name'))
          api.create_repo(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', exist_ok=True, private=False)
          PY
      - name: Discover datasets
        run: python scripts/data_gov_ua_discovery.py --output artifacts/discovery/data_gov_ua_catalog.json --limit 0
      - name: Select next bootstrap batch
        id: batch
        env:
          REQUESTED_BATCH: ${{ inputs.batch_index }}
          PROGRESS_FILE: ${{ env.PROGRESS_FILE }}
          BATCH_SIZE: ${{ env.DISCOVERY_BATCH_SIZE }}
          CATALOG_FILE: artifacts/discovery/data_gov_ua_catalog.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['PROGRESS_FILE'])
          catalog = json.loads(Path(os.environ['CATALOG_FILE']).read_text(encoding='utf-8'))
          datasets = catalog.get('datasets', catalog) if isinstance(catalog, dict) else catalog
          size = int(os.environ['BATCH_SIZE'])
          count = (len(datasets) + size - 1) // size
          if count < 1:
              raise SystemExit('Discovery catalog contains no datasets')
          requested = os.environ.get('REQUESTED_BATCH', '')
          state = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          failed = [int(x) for x in state.get('failed_batches', [])]
          if requested and requested != 'auto':
              batch = int(requested)
              if batch < 0 or batch >= count:
                  raise SystemExit(f'Invalid batch_index={batch}; catalog has {count} batches')
              mode = 'manual'
          elif state.get('bootstrap_complete'):
              print('Initial bootstrap already complete. Daily refresh workflow owns updates now.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write(f'skip=true\nmode=complete\nbatch=0\noffset=0\nbatch_count={count}\n')
              raise SystemExit(0)
          else:
              next_batch = int(state.get('next_batch', 0))
              if next_batch < count:
                  batch = next_batch
                  mode = 'bootstrap'
              elif failed:
                  batch = failed[0]
                  mode = 'retry'
              else:
                  print('All bootstrap batches are complete and no failed batches remain; marking bootstrap complete.')
                  state['next_batch'] = count
                  state['completed_batches'] = count
                  state['batch_count'] = count
                  state['failed_batches'] = []
                  state['bootstrap_complete'] = True
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                      fh.write(f'skip=true\nmode=complete\nbatch=0\noffset=0\nbatch_count={count}\n')
                  raise SystemExit(0)
          offset = batch * size
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'skip=false\nmode={mode}\nbatch={batch}\noffset={offset}\nbatch_count={count}\n')
          print(f'Selected {mode} dataset batch {batch}/{count - 1}, offset {offset}, size {size}')
          PY
      - name: Mirror discovered datasets
        id: mirror
        if: steps.batch.outputs.skip != 'true'
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=60s 150m \
            python scripts/data_gov_ua_discovered_sync.py \
              --catalog artifacts/discovery/data_gov_ua_catalog.json \
              --dataset-offset "${{ steps.batch.outputs.offset }}" \
              --dataset-limit "$DISCOVERY_BATCH_SIZE" \
              --max-dataset-files 0 \
              --max-file-mb 0 \
              --incremental \
              --allow-failures
      - name: Assess batch result
        id: assess
        if: steps.batch.outputs.skip != 'true'
        run: |
          failed=0
          if [ ! -f artifacts/discovered-open-data/discovered-manifest.json ]; then
            echo 'Batch manifest missing, treating batch as failed.'
            failed=1
          else
            failed="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/discovered-open-data/discovered-manifest.json').read_text(encoding='utf-8'))
          print(sum(len(x.get('failed', [])) for x in data if isinstance(x, dict)))
          PY
          )"
          fi
          echo "failed=$failed"
          if [ "$failed" -gt 0 ]; then
            echo 'Batch contains failed resources; it will be retried after the initial catalog pass.'
            echo 'has_failures=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Batch has no failed resources.'
            echo 'has_failures=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Persist bootstrap progress
        if: steps.batch.outputs.skip != 'true'
        env:
          PROGRESS_FILE: ${{ env.PROGRESS_FILE }}
          MODE: ${{ steps.batch.outputs.mode }}
          BATCH: ${{ steps.batch.outputs.batch }}
          BATCH_COUNT: ${{ steps.batch.outputs.batch_count }}
          HAS_FAILURES: ${{ steps.assess.outputs.has_failures }}
        run: |
          mkdir -p "$(dirname "$PROGRESS_FILE")"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ['PROGRESS_FILE'])
          state = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          mode = os.environ['MODE']
          batch = int(os.environ['BATCH'])
          count = int(os.environ['BATCH_COUNT'])
          failed = {int(x) for x in state.get('failed_batches', [])}
          if os.environ['HAS_FAILURES'] == 'true':
              failed.add(batch)
          else:
              failed.discard(batch)
          if mode == 'bootstrap':
              state['next_batch'] = max(int(state.get('next_batch', 0)), batch + 1)
          elif mode == 'retry':
              state['next_batch'] = count
          state['failed_batches'] = sorted(failed)
          state['completed_batches'] = min(int(state.get('next_batch', 0)), count)
          state['batch_count'] = count
          state['bootstrap_complete'] = state['completed_batches'] >= count and not failed
          state['updated_at_utc'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROGRESS_FILE"
          git diff --cached --quiet || git commit -m "chore(data): persist discovered open-data progress"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "git push failed on attempt $attempt; rebasing onto origin/main before retry"
            git pull --rebase origin main
          done
          echo 'Unable to persist bootstrap progress after 3 push attempts.'
          exit 1
      - name: Write publication status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="discovered open-data bootstrap completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal publication --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/discovery/data_gov_ua_catalog.json
      - name: Upload publication status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-publication
          path: artifacts/status/signals/publication.json
          if-no-files-found: error
          retention-days: 30
