name: EDRSR Hugging Face Upload

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to process, or all for every available year'
        required: true
        default: 'all'
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/edrsr_sync.py'
      - 'scripts/edrsr/**'
      - '.github/workflows/edrsr-huggingface.yml'

permissions:
  contents: read

concurrency:
  group: edrsr-huggingface
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
      EDRSR_YEAR: ${{ inputs.year || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip huggingface_hub pyarrow

      - name: Verify Hugging Face authentication and dataset access
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('Hugging Face authentication OK')
          print('account:', me.get('name') or me.get('fullname') or me.get('email'))
          repo = os.environ['HF_DATASET_REPO']
          api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, private=False)
          print('Dataset repository ready:', repo)
          PY

      - name: Sync and publish EDRSR years
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/edrsr

          if [[ "$EDRSR_YEAR" == "all" ]]; then
            YEARS=$(seq 2000 2026)
          else
            YEARS="$EDRSR_YEAR"
          fi

          for year in $YEARS; do
            echo "============================================================"
            echo "Processing EDRSR year: $year"
            echo "============================================================"
            rm -rf "artifacts/edrsr/$year"
            mkdir -p "artifacts/edrsr/$year"

            if ! python scripts/edrsr_sync.py --year "$year" --output-dir "artifacts/edrsr/$year"; then
              echo "Year $year is unavailable or failed discovery/download. Skipping and continuing."
              rm -rf "artifacts/edrsr/$year"
              continue
            fi

            test -s "artifacts/edrsr/$year/manifest.json"
            find "artifacts/edrsr/$year" -type f -name '*.parquet' -print -quit | grep -q .

            YEAR="$year" python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET_REPO']
          year = os.environ['YEAR']
          root = Path('artifacts/edrsr') / year

          for path in sorted(root.rglob('*')):
              if path.is_file():
                  target = path.relative_to(Path('artifacts/edrsr')).as_posix()
                  api.upload_file(
                      path_or_fileobj=str(path),
                      path_in_repo=target,
                      repo_id=repo,
                      repo_type='dataset',
                  )
                  print('Uploaded:', target)

          info = api.dataset_info(repo_id=repo)
          prefix = f'{year}/'
          visible = [s.rfilename for s in (info.siblings or []) if s.rfilename.startswith(prefix)]
          if not visible:
              raise SystemExit(f'Upload verification failed for year {year}')
          print(f'Year {year} published successfully: {len(visible)} files')
          PY
          done

      - name: Final Hugging Face verification
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET_REPO']
          info = api.dataset_info(repo_id=repo)
          files = sorted(s.rfilename for s in (info.siblings or []))
          years = sorted({p.split('/', 1)[0] for p in files if '/' in p and p.split('/', 1)[0].isdigit()})
          print('Dataset:', repo)
          print('Years published:', ', '.join(years) or 'none')
          print('Total Hub files:', len(files))
          if 'manifest.json' not in files and not any(p.endswith('/manifest.json') for p in files):
              raise SystemExit('No manifest files found on Hugging Face')
          PY
