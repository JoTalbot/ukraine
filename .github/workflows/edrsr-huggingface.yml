name: EDRSR Hugging Face Upload

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'EDRSR year to process'
        required: true
        default: '2026'
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/edrsr_sync.py'
      - 'scripts/edrsr/**'
      - '.github/workflows/edrsr-huggingface.yml'

permissions:
  contents: read

concurrency:
  group: edrsr-huggingface
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
      EDRSR_YEAR: ${{ inputs.year || '2026' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip huggingface_hub pyarrow

      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('Hugging Face authentication OK')
          print('account:', me.get('name') or me.get('fullname') or me.get('email'))
          PY

      - name: Run EDRSR pipeline
        run: |
          rm -rf artifacts/edrsr
          python scripts/edrsr_sync.py --year "$EDRSR_YEAR" --output-dir artifacts/edrsr
          test -s artifacts/edrsr/manifest.json
          find artifacts/edrsr -type f -name '*.parquet' -print -quit | grep -q .

      - name: Publish dataset to Hugging Face
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET_REPO']

          # Create the dataset if it does not exist. Keep it public so it is
          # visible in the user's Hugging Face datasets list.
          api.create_repo(
              repo_id=repo,
              repo_type='dataset',
              exist_ok=True,
              private=False,
          )

          root = Path('artifacts/edrsr')
          files = sorted(root.rglob('*.parquet'))
          if not files:
              raise SystemExit('No Parquet files produced by EDRSR pipeline')

          uploaded = []
          for path in files:
              target = path.relative_to(root).as_posix()
              api.upload_file(
                  path_or_fileobj=str(path),
                  path_in_repo=target,
                  repo_id=repo,
                  repo_type='dataset',
              )
              uploaded.append(target)

          manifest = root / 'manifest.json'
          api.upload_file(
              path_or_fileobj=str(manifest),
              path_in_repo='manifest.json',
              repo_id=repo,
              repo_type='dataset',
          )

          # Final verification: the dataset repository must be readable and
          # contain the manifest after upload.
          info = api.dataset_info(repo_id=repo)
          siblings = {s.rfilename for s in (info.siblings or [])}
          if 'manifest.json' not in siblings:
              raise SystemExit('Upload verification failed: manifest.json missing')

          print(f'Dataset ready: {repo}')
          print(f'Uploaded Parquet files: {len(uploaded)}')
          print(f'Repository files visible on Hub: {len(siblings)}')
          PY
