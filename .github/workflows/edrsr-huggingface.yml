name: EDRSR Hugging Face Upload

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to process, or all for 2020-2026'
        required: true
        default: 'all'
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/edrsr_sync.py'
      - 'scripts/edrsr/**'
      - '.github/workflows/edrsr-huggingface.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - name: Resolve requested years
        id: years
        run: |
          REQUESTED="${{ inputs.year || 'all' }}"
          if [ "$REQUESTED" = "all" ]; then
            echo 'years=[2020, 2021, 2022, 2023, 2024, 2025, 2026]' >> "$GITHUB_OUTPUT"
          else
            echo "years=[$REQUESTED]" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
      YEAR: ${{ matrix.year }}
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    concurrency:
      # One slot per year: a slow year never blocks the other years, and a
      # queued run becomes a cheap no-op thanks to change detection.
      group: edrsr-${{ matrix.year }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip huggingface_hub pyarrow

      - name: Verify Hugging Face authentication and dataset access
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('Hugging Face authentication OK')
          print('account:', me.get('name') or me.get('fullname') or me.get('email'))
          repo = os.environ['HF_DATASET_REPO']
          api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, private=False)
          # create_repo(exist_ok=True) does not change the visibility of an
          # already existing repository, so enforce public explicitly.
          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False)
          print('Dataset repository ready (public):', repo)
          PY

      - name: Resolve previous archive tag
        id: prev
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          tag = ""
          try:
              path = hf_hub_download(
                  repo_id=os.environ['HF_DATASET_REPO'],
                  repo_type='dataset',
                  filename=os.environ['YEAR'] + '/manifest.json',
                  token=os.environ['HF_TOKEN'],
              )
              with open(path, encoding='utf-8') as fh:
                  tag = (json.load(fh) or {}).get('remote_change_tag') or ""
          except Exception as exc:
              print('No previous manifest on Hugging Face:', exc)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('tag=' + tag + '\n')
          PY

      - name: Sync EDRSR year
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -u
          mkdir -p "artifacts/edrsr/$YEAR"
          if ! python scripts/edrsr_sync.py --year "$YEAR" \
                --output-dir "artifacts/edrsr/$YEAR" \
                --skip-if-tag "$PREV_TAG"; then
            echo "Year $YEAR is unavailable or failed discovery/download. Skipping and continuing."
            rm -rf "artifacts/edrsr/$YEAR"
          fi

      - name: Publish year to Hugging Face
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import HfApi

          year = os.environ['YEAR']
          repo = os.environ['HF_DATASET_REPO']
          root = Path('artifacts/edrsr') / year
          manifest_path = root / 'manifest.json'
          if not manifest_path.is_file():
              raise SystemExit(f'No manifest produced for year {year}')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('skipped'):
              print(f'Year {year}: remote archive unchanged, nothing to upload.')
              raise SystemExit(0)
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path=str(root),
              path_in_repo=year,
              repo_id=repo,
              repo_type='dataset',
              commit_message=f'EDRSR {year}: {manifest.get("records")} records',
          )
          info = api.dataset_info(repo_id=repo)
          prefix = f'{year}/'
          visible = [s.rfilename for s in (info.siblings or []) if s.rfilename.startswith(prefix)]
          if not visible:
              raise SystemExit(f'Upload verification failed for year {year}')
          print(f'Year {year} published successfully: {len(visible)} files')
          PY

  verify:
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
    steps:
      - name: Final Hugging Face verification
        run: |
          python -m pip install --upgrade pip huggingface_hub >/dev/null
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET_REPO']
          info = api.dataset_info(repo_id=repo)
          files = sorted(s.rfilename for s in (info.siblings or []))
          years = sorted({p.split('/', 1)[0] for p in files if '/' in p and p.split('/', 1)[0].isdigit()})
          print('Dataset:', repo)
          print('Years published:', ', '.join(years) or 'none')
          print('Total Hub files:', len(files))
          if 'manifest.json' not in files and not any(p.endswith('/manifest.json') for p in files):
              raise SystemExit('No manifest files found on Hugging Face')
          PY
