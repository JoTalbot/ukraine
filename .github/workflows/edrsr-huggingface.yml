name: EDRSR Hugging Face Upload

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to process, or all for 2020-2026'
        required: true
        default: 'all'
  schedule:
    - cron: '20 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/edrsr_sync.py'
      - 'scripts/edrsr/**'
      - '.github/workflows/edrsr-huggingface.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - name: Resolve requested years
        id: years
        run: |
          REQUESTED="${{ inputs.year || 'all' }}"
          if [ "$REQUESTED" = "all" ]; then
            echo 'years=[2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]' >> "$GITHUB_OUTPUT"
          else
            echo "years=[$REQUESTED]" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
      YEAR: ${{ matrix.year }}
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    concurrency:
      group: edrsr-${{ matrix.year }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip huggingface_hub pyarrow

      - name: Verify Hugging Face authentication and dataset access
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('Hugging Face authentication OK')
          print('account:', me.get('name') or me.get('fullname') or me.get('email'))
          repo = os.environ['HF_DATASET_REPO']
          api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, private=False)
          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False)
          print('Dataset repository ready (public):', repo)
          PY

      - name: Resolve previous archive tag
        id: prev
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          PIPELINE_VERSION = 2
          tag = ""
          try:
              path = hf_hub_download(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', filename=os.environ['YEAR'] + '/manifest.json', token=os.environ['HF_TOKEN'])
              with open(path, encoding='utf-8') as fh:
                  manifest = json.load(fh) or {}
              if manifest.get('pipeline_version') == PIPELINE_VERSION:
                  tag = manifest.get('remote_change_tag') or ""
              else:
                  print('Previous manifest used pipeline_version', manifest.get('pipeline_version'), '- reprocessing.')
          except Exception as exc:
              print('No previous manifest on Hugging Face:', exc)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('tag=' + tag + '\n')
          PY

      - name: Sync EDRSR year
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -u
          mkdir -p "artifacts/edrsr/$YEAR"
          if ! python scripts/edrsr_sync.py --year "$YEAR" --output-dir "artifacts/edrsr/$YEAR" --skip-if-tag "$PREV_TAG"; then
            echo "Year $YEAR is unavailable or failed discovery/download. Skipping and continuing."
            rm -rf "artifacts/edrsr/$YEAR"
          fi

      - name: Publish year to Hugging Face
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import HfApi
          year = os.environ['YEAR']
          repo = os.environ['HF_DATASET_REPO']
          root = Path('artifacts/edrsr') / year
          manifest_path = root / 'manifest.json'
          if not manifest_path.is_file():
              raise SystemExit(f'No manifest produced for year {year}')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('skipped'):
              print(f'Year {year}: remote archive unchanged, nothing to upload.')
              raise SystemExit(0)
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(folder_path=str(root), path_in_repo=year, repo_id=repo, repo_type='dataset', commit_message=f'EDRSR {year}: {manifest.get("records")} records')
          info = api.dataset_info(repo_id=repo)
          prefix = f'{year}/'
          visible = [s.rfilename for s in (info.siblings or []) if s.rfilename.startswith(prefix)]
          if not visible:
              raise SystemExit(f'Upload verification failed for year {year}')
          print(f'Year {year} published successfully: {len(visible)} files')
          PY

  card:
    name: Dataset card and legacy cleanup
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always()
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip huggingface_hub

      - name: Remove superseded files and publish dataset card
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          repo = os.environ['HF_DATASET_REPO']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          files = sorted(s.rfilename for s in (api.dataset_info(repo_id=repo).siblings or []))
          years = sorted({f.split('/', 1)[0] for f in files if '/' in f and f.split('/', 1)[0].isdigit()})
          stale = []
          for year in years:
              names = {f.split('/', 1)[1] for f in files if f.startswith(year + '/')}
              has_parts = any(n.startswith('part-') and n.endswith('.parquet') for n in names)
              if has_parts and 'edrsr.parquet' in names:
                  stale.append(f'{year}/edrsr.parquet')
          if stale:
              for path in stale:
                  try:
                      api.delete_file(path_in_repo=path, repo_id=repo, repo_type='dataset')
                  except Exception as exc:
                      print(f'WARN: could not delete {path}: {exc}')
              print('Removed legacy single-file exports for years:', ', '.join(sorted(s.split('/')[0] for s in stale)))
          rows = []
          for year in years:
              try:
                  path = hf_hub_download(repo_id=repo, repo_type='dataset', filename=f'{year}/manifest.json', token=token)
                  manifest = json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  print(f'WARN: no manifest for {year}: {exc}')
                  manifest = {}
              rows.append((year, manifest.get('records'), (manifest.get('sha256') or '')[:12]))
          lines = ['# ЄДРСР — судові рішення України (нормалізоване дзеркало)', '', 'Автоматичне дзеркало офіційних публікацій Єдиного державного реєстру судових рішень ', 'на [data.gov.ua](https://data.gov.ua) (Державна судова адміністрація України).', 'Пайплайн: [JoTalbot/ukraine](https://github.com/JoTalbot/ukraine).', '', '## Роки та обсяги', '', '| Рік | Записів | SHA-256 архіву |', '|---|---|---|']
          for year, records, digest in rows:
              lines.append(f'| {year} | {records if records is not None else "—"} | `{digest}…` |')
          lines += ['', '## Структура', '', '- `<рік>/part-XXXXX.parquet` — партії по ~250 000 записів (zstd).', '- `<рік>/manifest.json` — URL джерела, SHA-256 архіву, кількість записів, тег зміни (ETag).', '- Старі однорайлові експорти `<рік>/edrsr.parquet` видаляються після успішного завантаження партій.', '', '## Умови використання', '', '- Дані поширюються на умовах офіційної публікації джерела; перед використанням перевірте умови на data.gov.ua.', '- Обезличення, передбачене джерелом, збережено; датасет не призначений для деанонімізації.', '', f'_Оновлено: {datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}_', '']
          Path('README.md').write_text('\n'.join(lines), encoding='utf-8')
          api.upload_file(path_or_fileobj='README.md', path_in_repo='README.md', repo_id=repo, repo_type='dataset')
          print(f'Dataset card updated ({len(rows)} years).')
          PY

  verify:
    needs: [upload, card]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: JoTalbot/ua-edrsr
    steps:
      - name: Final Hugging Face verification
        run: |
          python -m pip install --upgrade pip huggingface_hub >/dev/null
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET_REPO']
          info = api.dataset_info(repo_id=repo)
          files = sorted(s.rfilename for s in (info.siblings or []))
          years = sorted({p.split('/', 1)[0] for p in files if '/' in p and p.split('/', 1)[0].isdigit()})
          print('Dataset:', repo)
          print('Years published:', ', '.join(years) or 'none')
          print('Total Hub files:', len(files))
          if 'manifest.json' not in files and not any(p.endswith('/manifest.json') for p in files):
              raise SystemExit('No manifest files found on Hugging Face')
          PY
