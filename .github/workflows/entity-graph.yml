name: Entity Graph Build

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 0'  # weekly, Sunday

permissions:
  contents: write

concurrency:
  group: entity-graph
  cancel-in-progress: false

env:
  HF_DATASET_GRAPH: JoTalbot/ua-entity-graph
  HF_OPEN: JoTalbot/ua-open-data
  HF_EDRSR: JoTalbot/ua-edrsr

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub openpyxl

      - name: Download graph inputs from Hugging Face
        run: |
          set -euo pipefail
          mkdir -p data/edrsr
          : > data/provenance-sources.tsv
          curl -fsSL --retry 5 --retry-all-errors -o data/UO.zip "https://huggingface.co/datasets/${HF_OPEN}/resolve/main/edr/UO.zip"
          printf '%s\n' "https://huggingface.co/datasets/${HF_OPEN}/resolve/main/edr/UO.zip=data/UO.zip" >> data/provenance-sources.tsv
          curl -fsSL --retry 5 --retry-all-errors -o data/pdv.csv "https://huggingface.co/datasets/${HF_OPEN}/resolve/main/vat_payers/pdv_actual.csv"
          printf '%s\n' "https://huggingface.co/datasets/${HF_OPEN}/resolve/main/vat_payers/pdv_actual.csv=data/pdv.csv" >> data/provenance-sources.tsv
          python - <<'PY'
          import json, subprocess, urllib.request
          YEARS, PARTS = ['2024', '2025', '2026'], 4
          with open('data/provenance-sources.tsv', 'a', encoding='utf-8') as provenance:
              for year in YEARS:
                  url = f'https://huggingface.co/api/datasets/JoTalbot/ua-edrsr/tree/main/{year}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'ukraine-entity-graph'})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          entries = json.load(r)
                  except Exception as e:
                      print(f'no parts for {year}: {e}')
                      continue
                  for entry in sorted(entries, key=lambda e: e['path'])[:PARTS]:
                      dest = 'data/edrsr/' + entry['path'].replace('/', '_')
                      source = f'https://huggingface.co/datasets/JoTalbot/ua-edrsr/resolve/main/{entry["path"]}'
                      print('download', entry['path'])
                      subprocess.run(['curl', '-fsSL', '--retry', '5', '--retry-all-errors', '-o', dest, source], check=True)
                      provenance.write(f'{source}={dest}\n')
          PY
          du -sh data data/edrsr

      - name: Download person registers from Hugging Face
        run: |
          set -euo pipefail
          mkdir -p data/person
          download() {
            local url="https://huggingface.co/datasets/${HF_OPEN}/resolve/main/$1/$2"
            echo "download $1/$2"
            if curl -fsSL --retry 3 --retry-all-errors -o "data/person/$3" "$url"; then
              printf '%s\n' "$url=data/person/$3" >> data/provenance-sources.tsv
            else
              echo "skip $1/$2 (недоступен/изменился)"
              rm -f "data/person/$3"
            fi
          }
          download wanted_fugitives MVSWantedPerson_1.json wanted_fugitives.json
          download missing_persons BezvistiWanted.json missing_persons.json
          download advocates registerOfLawyers.json advocates.json
          download advocates structureRegisterOfLawyers.csv advocates.csv
          download notaries 17-ex_xml_wern.zip notaries.zip
          download court_experts 19-ex_xml_EXPERT.zip court_experts.zip
          download arbitration_managers 24-ex_xml_arbker.zip arbitration_managers.zip
          download audit_register auditors_2026-09-03.json auditors.json
          download debtors 29-ex_csv_erb.zip debtors.zip
          ls -la data/person || true

      - name: Write entity graph provenance
        run: |
          set -euo pipefail
          python scripts/write_entity_graph_provenance.py --sources-file data/provenance-sources.tsv --output graph_provenance.json --years 2024,2025,2026 --parts-per-year 4

      - name: Ingest person registers (best-effort, adds to core graph)
        run: |
          set +e
          python scripts/entity_links.py add-people --db links.db \
            --json-register wanted_fugitives=data/person/wanted_fugitives.json \
            --json-register missing_persons=data/person/missing_persons.json \
            --json-register advocates=data/person/advocates.json \
            --csv-register advocates=data/person/advocates.csv \
            --xml-register notaries=data/person/notaries.zip \
            --xml-register court_experts=data/person/court_experts.zip \
            --xml-register arbitration_managers=data/person/arbitration_managers.zip \
            --json-register audit_register=data/person/auditors.json
          rc1=$?
          if [ -f data/person/debtors.zip ]; then
            timeout --signal=TERM --kill-after=30s 40m python scripts/entity_links.py add-people --db links.db \
              --zipcsv-register debtors=data/person/debtors.zip
            rc2=$?
          else
            echo "debtors.zip не скачан — пропуск"; rc2=0
          fi
          set -e
          echo "person-register ingestion: fast rc=$rc1, debtors rc=$rc2 (non-zero tolerated; see log)"
          exit 0

      - name: Resolve name-only people to РНОКПП identities (heuristic)
        run: |
          set +e
          python scripts/entity_links.py link-names --db links.db --min-score 0.98 --limit 0
          rc=$?
          set -e
          echo "name-resolution exit code: $rc (non-zero tolerated; see log)"
          exit 0

      - name: Validate graph contents
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('links.db')
          stats = {
              'entities': db.execute('SELECT COUNT(*) FROM entities').fetchone()[0],
              'mentions': db.execute('SELECT COUNT(*) FROM mentions').fetchone()[0],
              'edges': db.execute('SELECT COUNT(*) FROM edges').fetchone()[0],
          }
          print(json.dumps(stats, indent=2))
          if stats['entities'] < 1000 or stats['edges'] < 1000:
              raise SystemExit('graph is unexpectedly small; refusing to publish')
          with open('graph_stats.json', 'w', encoding='utf-8') as fh:
              json.dump(stats, fh)
          PY

      - name: Publish graph to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import datetime, json, os
          from huggingface_hub import HfApi
          stats = json.load(open('graph_stats.json', encoding='utf-8'))
          repo = os.environ.get('HF_DATASET_GRAPH', 'JoTalbot/ua-entity-graph')
          card = '\n'.join([
              '---', 'language: uk', 'tags:', '- entity-linkage', '- ukraine', '- open-data', '- graph', '---', '',
              '# ua-entity-graph — граф связей сущностей украинских открытых данных', '',
              f"- Сущностей: **{stats['entities']:,}**", f"- Упоминаний: **{stats['mentions']:,}**", f"- Рёбер: **{stats['edges']:,}**",
              f"- Сборка: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}", '',
              'Файл `links.db` — SQLite: таблицы `entities`, `mentions`, `edges`.',
              'Запросы: `python scripts/entity_links.py search --db links.db --id <ЄДРПОУ>`.', '',
              'Источники: ЄДР, ПДВ, ЄДРСР, а також person-реестры (wanted, missing,', 'notaries, court_experts, arbitration_managers, advocates, auditors, debtors).',
              'Точная входная provenance: `graph_provenance.json` содержит URL, локальный путь, размер и SHA-256 каждого успешно скачанного файла.',
              'Рёбра identity/name_resolve — консервативное разрешение по ФИО.', 'Только законно опубликованные открытые данные;', 'обезличивание источника сохраняется (no_deanonymization).', ''])
          with open('GRAPH_CARD.md', 'w', encoding='utf-8') as fh:
              fh.write(card)
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, private=False)
          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False)
          api.upload_file(path_or_fileobj='GRAPH_CARD.md', path_in_repo='README.md', repo_id=repo, repo_type='dataset')
          api.upload_file(path_or_fileobj='links.db', path_in_repo='links.db', repo_id=repo, repo_type='dataset')
          api.upload_file(path_or_fileobj='graph_stats.json', path_in_repo='graph_stats.json', repo_id=repo, repo_type='dataset')
          api.upload_file(path_or_fileobj='graph_provenance.json', path_in_repo='graph_provenance.json', repo_id=repo, repo_type='dataset')
          print('published entity graph to', repo, stats)
          PY

      - name: Persist graph stats
        run: |
          set -euo pipefail
          mkdir -p .training-manifests/entity-graph
          cp graph_stats.json .training-manifests/entity-graph/stats.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .training-manifests/entity-graph/stats.json
          if git diff --cached --quiet; then echo 'No stat changes.'; else
            git commit -m 'chore: update entity graph stats'
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "persist attempt $attempt failed; resetting onto origin/main and re-applying"
              git fetch origin main
              git reset --hard origin/main
              mkdir -p .training-manifests/entity-graph
              cp graph_stats.json .training-manifests/entity-graph/stats.json
              git add .training-manifests/entity-graph/stats.json
              if git diff --cached --quiet; then echo 'No stat changes after reset.'; pushed=true; break; fi
              git commit -m 'chore: update entity graph stats'
            done
            if [ "$pushed" != true ]; then echo 'Failed to push graph stats after retries' >&2; exit 1; fi
          fi

      - name: Run summary
        if: ${{ always() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '> статистика графа недоступна (сборка не завершилась)' >> "$GITHUB_STEP_SUMMARY"
          import json
          stats = json.load(open('graph_stats.json', encoding='utf-8'))
          print('## Entity Graph\n')
          print('| метрика | значение |')
          print('|---|---|')
          for key in ('entities', 'mentions', 'edges'):
              print(f"| {key} | {stats.get(key, '—'):,} |")
          print('\n[ua-entity-graph на Hugging Face](https://huggingface.co/datasets/JoTalbot/ua-entity-graph)')
          PY

      - name: Write graph status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="entity graph workflow completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py --signal graph --state "$state" --detail "$detail" --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" --workflow-run-id "$WORKFLOW_RUN_ID" --artifact graph_stats.json

      - name: Upload graph status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-graph
          path: artifacts/status/signals/graph.json
          if-no-files-found: error
          retention-days: 30
