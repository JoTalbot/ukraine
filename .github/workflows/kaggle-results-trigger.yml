name: Kaggle Results Trigger

on:
  push:
    paths:
      - '.training-manifests/ua-legal-lm-gpu/kernel-version.txt'
      - '.training-manifests/ua-legal-lm-ft/kernel-version.txt'
      - '.github/workflows/kaggle-results-trigger.yml'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: kaggle-results-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Kaggle Results collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kaggle-results.yml --ref main --repo "${GITHUB_REPOSITORY}"
