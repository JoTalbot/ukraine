name: Kaggle Kernel Results

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          python -m pip install --upgrade pip kaggle >/dev/null
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets list --max-size 1 >/dev/null
          echo 'Kaggle authentication succeeded.'

      - name: Check kernel status and download output when complete
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
          KAGGLE_USERNAME_OVERRIDE: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -e
          USERNAME="${KAGGLE_USERNAME_OVERRIDE:-}"
          if [ -z "$USERNAME" ] && python -c "import json,os;json.loads(os.environ['KAGGLE_API_TOKEN'])" 2>/dev/null; then
            USERNAME=$(python -c "import json,os;print(json.loads(os.environ['KAGGLE_API_TOKEN']).get('username') or '')")
          fi
          if [ -z "$USERNAME" ]; then
            USERNAME=$(kaggle kernels list --mine 2>/dev/null | grep -oE '[A-Za-z0-9_-]+/[A-Za-z0-9_-]+' | head -1 | cut -d/ -f1 || true)
          fi
          test -n "$USERNAME" || { echo 'Cannot resolve Kaggle username'; exit 0; }
          KERNEL_ID="${USERNAME}/ua-legal-lm-gpu"
          STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 | tr '[:upper:]' '[:lower:]' || true)
          echo "kernel status: ${STATUS:-unknown}"
          case "$STATUS" in
            *running*|*queued*)
              echo 'Kernel still busy; nothing to collect.'
              exit 0
              ;;
          esac
          mkdir -p artifacts/gpu-lm
          if kaggle kernels output "$KERNEL_ID" -p artifacts/gpu-lm; then
            # The kernel working dir also contains its repo clone and source
            # data; only model/ holds the training output we need.
            find artifacts/gpu-lm -type f -exec ls -la {} \; | head -40
          else
            echo 'No output available yet.'
            exit 0
          fi

      - name: Upload kernel output artifact
        if: ${{ hashFiles('artifacts/gpu-lm/model/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ua-legal-lm-gpu-output
          path: artifacts/gpu-lm/model/
          retention-days: 30

      - name: Publish GPU model to Hugging Face Hub
        if: ${{ hashFiles('artifacts/gpu-lm/model/model.pt') != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: JoTalbot/ua-legal-lm-gpu
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing; skipping GPU model publish'; exit 0; }
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import datetime, json, math, os
          from pathlib import Path
          from huggingface_hub import HfApi

          repo = os.environ['HF_MODEL_REPO']
          root = Path('artifacts/gpu-lm/model')
          metrics = [json.loads(l) for l in (root / 'metrics.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]
          val = [m for m in metrics if 'val_loss' in m]
          last_val = val[-1]['val_loss'] if val else None
          last_step = max((m.get('step', 0) for m in metrics), default=0)
          ppl = round(math.exp(last_val), 2) if last_val else None

          card_lines = [
              '---',
              'language: uk',
              'tags:',
              '- legal',
              '- ukraine',
              '- ukrainian',
              '- from-scratch',
              '- open-data',
              'datasets:',
              '- JoTalbot/ua-edrsr',
              '- JoTalbot/ua-open-data',
              '---',
              '',
              '# ua-legal-lm-gpu — українська legal-LM (~29M), навчена з нуля на GPU',
              '',
              'GPT (PyTorch): dim 512, 8 шарів, ctx 384, BPE 8192. Натренована кернелом',
              '[training/kaggle/legal_lm_gpu.ipynb](https://github.com/JoTalbot/ukraine) на Kaggle GPU',
              'на відкритих даних: метадані рішень ЄДРСР, ЄДР, реєстр платників ПДВ.',
              '',
              f'- Кроків навчання: {last_step}',
              f'- Val loss: {last_val} (perplexity ≈ {ppl})',
              f'- Дата: {datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}',
              '',
              'Файли: `model.pt` (state_dict + config), `tokenizer.json`, `metrics.jsonl`, `samples.txt`.',
              '',
              'Приватність: лише законно опубліковані відкриті дані; знеособлення джерела збережено.',
              '',
          ]
          Path('GPU_CARD.md').write_text('\n'.join(card_lines), encoding='utf-8')

          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(repo_id=repo, repo_type='model', exist_ok=True, private=False)
          api.update_repo_settings(repo_id=repo, repo_type='model', private=False)
          api.upload_file(path_or_fileobj='GPU_CARD.md', path_in_repo='README.md', repo_id=repo, repo_type='model')
          for name in ('model.pt', 'tokenizer.json', 'metrics.jsonl', 'samples.txt'):
              if (root / name).is_file():
                  api.upload_file(path_or_fileobj=str(root / name), path_in_repo=name, repo_id=repo, repo_type='model')
          print('Published GPU model to', repo, '| val_loss:', last_val)
          PY

      - name: Persist GPU training metrics
        if: ${{ hashFiles('artifacts/gpu-lm/model/*') != '' }}
        run: |
          set -euo pipefail
          mkdir -p .training-manifests/gpu-lm
          cp artifacts/gpu-lm/model/metrics.jsonl .training-manifests/gpu-lm/ 2>/dev/null || true
          cp artifacts/gpu-lm/model/samples.txt .training-manifests/gpu-lm/ 2>/dev/null || true
          cp artifacts/gpu-lm/model/error.txt .training-manifests/gpu-lm/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .training-manifests/gpu-lm
          if git diff --cached --quiet; then
            echo 'No GPU metric changes.'
          else
            git commit -m "chore: update gpu-lm training metrics"
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            echo 'Failed to push GPU metrics after retries' >&2
            exit 1
          fi
