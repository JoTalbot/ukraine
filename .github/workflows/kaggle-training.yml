name: Kaggle GPU Training

on:
  schedule:
    - cron: '45 5 * * 1,4'
  workflow_dispatch:
  workflow_run:
    workflows: ['Train Ukraine Models']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-training
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          echo 'Kaggle secret is configured.'
      - name: Prepare training manifest
        run: |
          mkdir -p artifacts/kaggle
          printf '%s\n' '{"status":"ready","training_scope":"public_open_data_only","deanonymization":false}' > artifacts/kaggle/training_manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-manifest
          path: artifacts/kaggle/training_manifest.json
          retention-days: 14

  dispatch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure and verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          python -m pip install --upgrade pip kaggle >/dev/null
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets list --max-size 1 >/dev/null
          echo 'Kaggle authentication succeeded.'
      - name: Push the GPU training kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
          KAGGLE_USERNAME_OVERRIDE: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -e
          mkdir -p /tmp/kernel
          cp training/kaggle/legal_lm_gpu.ipynb /tmp/kernel/
          USERNAME="${KAGGLE_USERNAME_OVERRIDE:-}"
          if [ -z "$USERNAME" ] && python -c "import json,os;json.loads(os.environ['KAGGLE_API_TOKEN'])" 2>/dev/null; then
            USERNAME=$(python -c "import json,os;print(json.loads(os.environ['KAGGLE_API_TOKEN']).get('username') or '')")
          fi
          if [ -z "$USERNAME" ]; then
            USERNAME=$(kaggle kernels list --mine 2>/dev/null | grep -oE '[A-Za-z0-9_-]+/[A-Za-z0-9_-]+' | head -1 | cut -d/ -f1 || true)
          fi
          if [ -z "$USERNAME" ]; then
            echo '::warning::Cannot resolve the Kaggle username (KGAT token without inline username and no existing kernels). Set the repository variable KAGGLE_USERNAME once, or create any manual kernel first.'
            exit 0
          fi
          KERNEL_ID="${USERNAME}/ua-legal-lm-gpu"
          STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 || true)
          echo "current kernel status: ${STATUS:-unknown}"
          case "$STATUS" in
            *running*|*queued*|*cancel*)
              echo "A kernel version is already ${STATUS}; skipping push to save GPU quota."
              exit 0
              ;;
          esac
          python - "$USERNAME" <<'PY'
          import json, sys, pathlib
          meta = {
              "id": f"{sys.argv[1]}/ua-legal-lm-gpu",
              "title": "ua-legal-lm-gpu",
              "code_file": "legal_lm_gpu.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "kernel_sources": [],
              "competition_sources": [],
          }
          pathlib.Path('/tmp/kernel/kernel-metadata.json').write_text(json.dumps(meta, indent=2))
          print('kernel id:', meta['id'])
          PY
          if kaggle kernels push -p /tmp/kernel; then
            echo 'Kernel pushed: it will train on a Kaggle GPU and publish to Hugging Face when HF_TOKEN is attached in Kaggle secrets.'
          else
            echo '::warning::kaggle kernels push failed (account may need phone verification or kernels acceptance). Fix in Kaggle settings.'
          fi
