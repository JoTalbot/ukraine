name: Kaggle GPU Training

on:
  schedule:
    - cron: '45 5 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Push even if a version is already running'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/train_lm.py'
      - 'scripts/build_lm_corpus.py'
      - 'scripts/patch_kaggle_notebooks.py'
      - '.github/workflows/kaggle-training.yml'

permissions:
  contents: write

concurrency:
  group: kaggle-gpu-training
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          echo 'Kaggle secret is configured.'
      - name: Prepare training manifest
        run: |
          mkdir -p artifacts/kaggle
          printf '%s\n' '{"status":"ready","training_scope":"public_open_data_only","deanonymization":false}' > artifacts/kaggle/training_manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kaggle-training-manifest
          path: artifacts/kaggle/training_manifest.json
          retention-days: 14

  dispatch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ua-legal-lm-gpu
            file: legal_lm_gpu.ipynb
          - slug: ua-legal-lm-ft
            file: legal_lm_finetune.ipynb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure and verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          python -m pip install --upgrade pip kaggle >/dev/null
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets list --max-size 1 >/dev/null
          echo 'Kaggle authentication succeeded.'
      - name: Push and verify the GPU training kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
          KAGGLE_USERNAME_OVERRIDE: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernel
          python scripts/patch_kaggle_notebooks.py
          cp training/kaggle/${{ matrix.file }} /tmp/kernel/
          USERNAME="${KAGGLE_USERNAME_OVERRIDE:-}"
          if [ -z "$USERNAME" ] && python -c "import json,os;json.loads(os.environ['KAGGLE_API_TOKEN'])" 2>/dev/null; then
            USERNAME=$(python -c "import json,os;print(json.loads(os.environ['KAGGLE_API_TOKEN']).get('username') or '')")
          fi
          if [ -z "$USERNAME" ]; then
            USERNAME=$(kaggle kernels list --mine 2>/dev/null | grep -oE '[A-Za-z0-9_-]+/[A-Za-z0-9_-]+' | head -1 | cut -d/ -f1 || true)
          fi
          test -n "$USERNAME" || { echo 'Cannot resolve Kaggle username'; exit 1; }
          KERNEL_ID="${USERNAME}/${{ matrix.slug }}"
          STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 | tr '[:upper:]' '[:lower:]' || true)
          echo "current kernel status [$KERNEL_ID]: ${STATUS:-unknown}"
          STATE_DIR=".training-manifests/${{ matrix.slug }}"
          mkdir -p "$STATE_DIR"
          PENDING=""
          PROCESSED=""
          [ -f "$STATE_DIR/kernel-version.txt" ] && PENDING=$(tr -d '\r\n ' < "$STATE_DIR/kernel-version.txt" || true)
          [ -f "$STATE_DIR/processed-version.txt" ] && PROCESSED=$(tr -d '\r\n ' < "$STATE_DIR/processed-version.txt" || true)
          if [ -n "$PENDING" ] && [ "$PENDING" != "$PROCESSED" ]; then
            case "$STATUS" in
              *running*|*queued*) echo "Version $PENDING is still active; skipping push."; exit 0 ;;
              *complete*) echo "Version $PENDING is complete and pending result collection; skipping push to keep it collectible."; exit 0 ;;
              *error*|*failed*|*cancelled*|*canceled*)
                LAST_SHA=$(tail -n 1 "$STATE_DIR/launch-history.tsv" 2>/dev/null | sed 's/\\t/\t/g' | awk -F'\t' '{print $NF}' || true)
                if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$GITHUB_SHA" ]; then
                  echo "Version $PENDING failed on the same commit ($GITHUB_SHA); waiting for a code change before retrying. Skipping push."
                  exit 0
                fi
                echo "Version $PENDING has failure status $STATUS and code changed since launch — re-pushing."
                ;;
            esac
          fi
          FORCE="${{ github.event.inputs.force || 'false' }}"
          case "$STATUS" in
            *running*|*queued*)
              if [ "$FORCE" != "true" ]; then
                echo "A version is already active; skipping push to save GPU quota."
                exit 0
              fi
              ;;
          esac
          python - "$USERNAME" "${{ matrix.slug }}" "${{ matrix.file }}" <<'PY'
          import json, sys, pathlib
          username, slug, code_file = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = {"id": f"{username}/{slug}", "title": slug, "code_file": code_file, "language": "python", "kernel_type": "notebook", "is_private": True, "enable_gpu": True, "enable_internet": True, "dataset_sources": [], "kernel_sources": [], "competition_sources": []}
          pathlib.Path('/tmp/kernel/kernel-metadata.json').write_text(json.dumps(meta, indent=2))
          PY
          PUSH_OUTPUT=$(kaggle kernels push -p /tmp/kernel 2>&1 | tee /tmp/kaggle-push.log)
          VERSION=$(printf '%s\n' "$PUSH_OUTPUT" | grep -oE 'Kernel version [0-9]+' | tail -1 | awk '{print $3}' || true)
          test -n "$VERSION" || { echo 'Could not determine pushed Kaggle kernel version'; cat /tmp/kaggle-push.log; exit 1; }
          echo "Kernel $KERNEL_ID version $VERSION pushed."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          persist_version() {
            printf '%s\n' "$VERSION" > "$STATE_DIR/kernel-version.txt"
            if ! grep -qF "$(printf '\t')$VERSION$(printf '\t')" "$STATE_DIR/launch-history.tsv" 2>/dev/null; then
              printf '%s\t%s\t%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" "$KERNEL_ID" "${GITHUB_SHA}" >> "$STATE_DIR/launch-history.tsv"
            fi
            git add "$STATE_DIR/kernel-version.txt" "$STATE_DIR/launch-history.tsv"
            if git diff --cached --quiet; then echo 'Kernel version state already persisted.'; return 0; fi
            git commit -m "chore: record Kaggle kernel version ${{ matrix.slug }} v$VERSION"
            git push
          }
          persisted=false
          for attempt in 1 2 3 4 5; do
            if persist_version; then persisted=true; break; fi
            echo "persist attempt $attempt failed; resetting onto origin/main and re-applying"
            git fetch origin main
            git reset --hard origin/main
          done
          if [ "$persisted" != true ]; then echo 'Failed to persist Kaggle version state' >&2; exit 1; fi
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 | tr '[:upper:]' '[:lower:]' || true)
            echo "post-push status attempt $attempt [$KERNEL_ID]: ${STATUS:-unknown}"
            case "$STATUS" in
              *running*|*queued*) exit 0 ;;
              *error*|*failed*|*cancelled*|*canceled*) echo "Kernel entered failure state: $STATUS"; exit 1 ;;
            esac
          done
          echo 'No queued/running status observed within verification window.'
          exit 1

  control-signal:
    needs: [dispatch]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Write training status signal
        env:
          NEEDS_RESULT: ${{ needs.dispatch.result }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$NEEDS_RESULT" = "success" ]; then state=green; fi
          detail="Kaggle training dispatch completed with result: $NEEDS_RESULT"
          python scripts/write_status_signal.py --signal training --state "$state" --detail "$detail" --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" --workflow-run-id "$WORKFLOW_RUN_ID"
      - name: Upload training status signal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-training
          path: artifacts/status/signals/training.json
          if-no-files-found: error
          retention-days: 30
