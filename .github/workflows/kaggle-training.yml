name: Kaggle GPU Training

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Train Ukraine Models']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-training
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          echo 'Kaggle secret is configured.'
      - name: Prepare training manifest
        run: |
          mkdir -p artifacts/kaggle
          printf '%s\n' '{"status":"ready","training_scope":"public_open_data_only","deanonymization":false}' > artifacts/kaggle/training_manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-manifest
          path: artifacts/kaggle/training_manifest.json
          retention-days: 14

  dispatch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure and verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          python -m pip install --upgrade pip kaggle
          kaggle datasets list --max-size 1 >/dev/null
          echo 'Kaggle authentication succeeded.'
      - name: Report training handoff
        run: |
          echo 'Training manifest is ready.'
          echo 'GPU execution is delegated to the configured Kaggle notebook/dataset.'
          echo 'No secret values are printed.'
