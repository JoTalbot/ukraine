name: Kaggle GPU Training

on:
  schedule:
    - cron: '45 5 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Push even if a version is already running'
        type: boolean
        default: false
  workflow_run:
    workflows: ['Train Ukraine Models']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-training
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          echo 'Kaggle secret is configured.'
      - name: Prepare training manifest
        run: |
          mkdir -p artifacts/kaggle
          printf '%s\n' '{"status":"ready","training_scope":"public_open_data_only","deanonymization":false}' > artifacts/kaggle/training_manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-manifest
          path: artifacts/kaggle/training_manifest.json
          retention-days: 14

  dispatch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ua-legal-lm-gpu
            file: legal_lm_gpu.ipynb
          - slug: ua-legal-lm-ft
            file: legal_lm_finetune.ipynb
    steps:
      - uses: actions/checkout@v5
      - name: Configure and verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API secret is missing'; exit 1; }
          python -m pip install --upgrade pip kaggle >/dev/null
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets list --max-size 1 >/dev/null
          echo 'Kaggle authentication succeeded.'
      - name: Push and verify the GPU training kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
          KAGGLE_USERNAME_OVERRIDE: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernel
          python scripts/patch_kaggle_notebooks.py
          cp training/kaggle/${{ matrix.file }} /tmp/kernel/
          USERNAME="${KAGGLE_USERNAME_OVERRIDE:-}"
          if [ -z "$USERNAME" ] && python -c "import json,os;json.loads(os.environ['KAGGLE_API_TOKEN'])" 2>/dev/null; then
            USERNAME=$(python -c "import json,os;print(json.loads(os.environ['KAGGLE_API_TOKEN']).get('username') or '')")
          fi
          if [ -z "$USERNAME" ]; then
            USERNAME=$(kaggle kernels list --mine 2>/dev/null | grep -oE '[A-Za-z0-9_-]+/[A-Za-z0-9_-]+' | head -1 | cut -d/ -f1 || true)
          fi
          test -n "$USERNAME" || { echo 'Cannot resolve Kaggle username'; exit 1; }
          KERNEL_ID="${USERNAME}/${{ matrix.slug }}"
          STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 | tr '[:upper:]' '[:lower:]' || true)
          echo "current kernel status [$KERNEL_ID]: ${STATUS:-unknown}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          case "$STATUS" in
            *running*|*queued*)
              if [ "$FORCE" != "true" ]; then
                echo "A version is already active; skipping push to save GPU quota."
                exit 0
              fi
              echo "Force push requested; replacing the active version."
              ;;
          esac
          python - "$USERNAME" "${{ matrix.slug }}" "${{ matrix.file }}" <<'PY'
          import json, sys, pathlib
          username, slug, code_file = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = {
              "id": f"{username}/{slug}",
              "title": slug,
              "code_file": code_file,
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "kernel_sources": [],
              "competition_sources": [],
          }
          pathlib.Path('/tmp/kernel/kernel-metadata.json').write_text(json.dumps(meta, indent=2))
          print('kernel id:', meta['id'])
          PY
          kaggle kernels push -p /tmp/kernel
          echo "Kernel ${{ matrix.slug }} pushed."
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>/dev/null | head -1 | tr '[:upper:]' '[:lower:]' || true)
            echo "post-push status attempt $attempt [$KERNEL_ID]: ${STATUS:-unknown}"
            case "$STATUS" in
              *running*|*queued*) exit 0 ;;
              *error*|*failed*|*cancelled*|*canceled*) echo "Kernel entered failure state: $STATUS"; exit 1 ;;
            esac
          done
          echo 'Kernel push accepted, but no queued/running status was observed within the verification window.'
          exit 1
