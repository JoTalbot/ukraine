name: Open Data Discovery

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Discover public datasets
        run: |
          python scripts/data_gov_ua_discovery.py --help

      - name: Validate catalog JSON
        run: python -m json.tool config/ukraine_open_data_catalog.json >/dev/null
