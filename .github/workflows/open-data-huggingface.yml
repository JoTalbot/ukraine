name: Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Catalog dataset id or all'
        required: true
        default: 'all'
  schedule:
    - cron: '25 4,16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/data_gov_ua_sync.py'
      - 'config/ukraine_open_data_catalog.json'
      - '.github/workflows/open-data-huggingface.yml'

permissions:
  contents: read

concurrency:
  group: ukraine-open-data-huggingface
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: JoTalbot/ua-open-data
  DATASET: ${{ inputs.dataset || 'all' }}
  HF_HUB_ENABLE_HF_TRANSFER: '1'

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests huggingface_hub hf_transfer
      - name: Verify Hugging Face authentication
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('Hugging Face authentication OK:', me.get('name') or me.get('fullname'))
          api.create_repo(repo_id=os.environ['HF_DATASET_REPO'], repo_type='dataset', exist_ok=True, private=False)
          print('Dataset ready:', os.environ['HF_DATASET_REPO'])
          PY
      - name: Mirror all Ukraine open datasets
        run: python scripts/data_gov_ua_sync.py --dataset "$DATASET"
      - name: Publish dataset card
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from huggingface_hub import HfApi
          repo = os.environ['HF_DATASET_REPO']
          api = HfApi(token=os.environ['HF_TOKEN'])
          entries = []
          manifest_path = Path('artifacts/open-data/manifest.json')
          if manifest_path.is_file():
              entries = json.loads(manifest_path.read_text(encoding='utf-8'))
          lines = ['# Україна: дзеркало відкритих даних (data.gov.ua)', '', 'Автоматичне дзеркало публічних наборів [data.gov.ua](https://data.gov.ua),', 'яке підтримує пайплайн [JoTalbot/ukraine](https://github.com/JoTalbot/ukraine).', '', '## Набори', '', '| Набір | Файлів | Джерело |', '|---|---|---|']
          for entry in entries:
              title = entry.get('title') or entry.get('catalog_id') or '—'
              count = len(entry.get('uploaded_files') or [])
              source = entry.get('source_url') or '—'
              lines.append(f'| {title} | {count} | {source} |')
          if not entries:
              lines.append('| _маніфест цього запуску порожній_ | — | — |')
          lines += ['', '## Умови використання', '', '- Дані поширюються на умовах офіційних публікацій джерела (data.gov.ua).', '- Провенанс: `manifest.json` та `discovered-manifest.json` у корені репозиторію.', '- Обезличение источника сохраняется; датасет не предназначен для деанонимизации.', '', f'_Оновлено: {datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}_', '']
          Path('README.md').write_text('\n'.join(lines), encoding='utf-8')
          api.upload_file(path_or_fileobj='README.md', path_in_repo='README.md', repo_id=repo, repo_type='dataset')
          print('Dataset card updated.')
          PY
      - name: Write publication status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="Ukraine open-data publication completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py \
            --signal publication --state "$state" --detail "$detail" \
            --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/open-data/manifest.json
      - name: Upload publication status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-publication
          path: artifacts/status/signals/publication.json
          if-no-files-found: error
          retention-days: 30
