name: Ukraine Open Data -> Hugging Face

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Catalog dataset id or all'
        required: true
        default: 'all'
  schedule:
    - cron: '25 4,16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/data_gov_ua_sync.py'
      - 'config/ukraine_open_data_catalog.json'
      - '.github/workflows/open-data-huggingface.yml'

permissions:
  contents: read

concurrency:
  # Keep independent immutable release candidates from blocking each other.
  # A legacy main-branch run may legitimately take hours while a release
  # candidate must still be able to publish its exact SHA.
  group: ukraine-open-data-huggingface-${{ github.ref }}
  cancel-in-progress: false
