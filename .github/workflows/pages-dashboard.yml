name: Pages Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_dashboard.py'
      - 'scripts/generate_release_manifest.py'
      - '.github/workflows/pages-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate release manifest
        run: python scripts/generate_release_manifest.py --output artifacts/status/release-manifest.json
      - name: Generate dashboard
        run: python scripts/build_dashboard.py --output dashboard
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
