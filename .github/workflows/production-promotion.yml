name: Production Promotion Authorization

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact release commit SHA to authorize'
        required: true
        type: string
      model_id:
        description: 'Immutable model identifier'
        required: true
        type: string
      artifact_path:
        description: 'Repository-relative path to the promoted model artifact'
        required: true
        type: string
      evaluation_evidence_path:
        description: 'Repository-relative path to the evaluation evidence artifact'
        required: true
        type: string
      release_sequence:
        description: 'Positive immutable production release sequence'
        required: true
        type: number

permissions:
  actions: read
  contents: read

jobs:
  authorize:
    name: Authorize production promotion
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate authorization inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MODEL_ID: ${{ inputs.model_id }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          EVALUATION_PATH: ${{ inputs.evaluation_evidence_path }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$MODEL_ID" ]]
          [[ "$ARTIFACT_PATH" == artifacts/* && "$ARTIFACT_PATH" != *..* ]]
          [[ "$EVALUATION_PATH" == artifacts/* && "$EVALUATION_PATH" != *..* ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Verify release commit and real artifacts
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          EVALUATION_PATH: ${{ inputs.evaluation_evidence_path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -s "$ARTIFACT_PATH"
          test -s "$EVALUATION_PATH"

      - name: Verify upstream release gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['SOURCE_COMMIT']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&branch=main',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as response:
              runs = json.load(response)['workflow_runs']

          required = {'Ukraine data CI', 'Security scan'}
          matching = [r for r in runs if r.get('head_sha') == sha]
          by_name = {r.get('name'): r for r in matching}
          missing = sorted(required - by_name.keys())
          failed = sorted(
              name for name in required & by_name.keys()
              if by_name[name].get('conclusion') != 'success'
          )
          if missing or failed:
              raise SystemExit(
                  f'promotion blocked: missing={missing}, non_success={failed}'
              )
          PY

      - name: Build authenticated authorization event
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MODEL_ID: ${{ inputs.model_id }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          EVALUATION_PATH: ${{ inputs.evaluation_evidence_path }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          APPROVAL_IDENTITY: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p promotion-authorization artifacts/status
          python - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path

          fields = (
              'schema_version', 'target', 'source_commit', 'model_id', 'artifact_path',
              'artifact_sha256', 'evaluation_evidence_path', 'evaluation_evidence_sha256',
              'approval_identity', 'release_sequence', 'approved_at',
          )
          def sha256(path: str) -> str:
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1048576), b''):
                      h.update(chunk)
              return h.hexdigest()

          artifact = Path(os.environ['ARTIFACT_PATH'])
          evaluation = Path(os.environ['EVALUATION_PATH'])
          payload = {
              'schema_version': 1,
              'target': 'production',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'model_id': os.environ['MODEL_ID'],
              'artifact_path': os.environ['ARTIFACT_PATH'],
              'artifact_sha256': sha256(str(artifact)),
              'evaluation_evidence_path': os.environ['EVALUATION_PATH'],
              'evaluation_evidence_sha256': sha256(str(evaluation)),
              'approval_identity': os.environ['APPROVAL_IDENTITY'],
              'release_sequence': int(os.environ['RELEASE_SEQUENCE']),
              'approved_at': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
          }
          canonical = {key: payload[key] for key in fields}
          payload['authorization_id'] = hashlib.sha256(
              (json.dumps(canonical, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode('utf-8')
          ).hexdigest()
          encoded = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          for destination in (
              Path('promotion-authorization/production-promotion-authorization.json'),
              Path('artifacts/status/production-promotion-authorization.json'),
          ):
              destination.write_text(encoded, encoding='utf-8')
          PY

      - name: Verify generated authorization event
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from scripts.verify_promotion_authorization import verify
          ok, issues = verify(Path('.'))
          if not ok:
              raise SystemExit(f'generated promotion authorization is invalid: {issues}')
          payload = json.loads(Path('artifacts/status/production-promotion-authorization.json').read_text(encoding='utf-8'))
          if payload['source_commit'] != subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip():
              raise SystemExit('authorization source_commit does not match checked-out release')
          PY

      - name: Upload authorization package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-promotion-authorization
          path: |
            promotion-authorization/production-promotion-authorization.json
            ${{ inputs.artifact_path }}
            ${{ inputs.evaluation_evidence_path }}
          if-no-files-found: error
          retention-days: 90
