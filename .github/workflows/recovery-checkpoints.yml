name: Recovery Checkpoints

on:
  workflow_run:
    workflows:
      - Entity Graph Build
      - Ukraine Open Data Discovery
      - Ukraine data CI
      - Train Ukraine Models
      - Kaggle GPU Training
      - Ukraine Open Data -> Hugging Face
      - Discovered Ukraine Open Data -> Hugging Face
      - EDRSR Hugging Face Upload
      - EDRSR Full Texts
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Fetch producer job steps
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/recovery
          gh api "repos/$REPOSITORY/actions/runs/$WORKFLOW_RUN_ID/jobs?per_page=100" > artifacts/recovery/producer-jobs.json
      - name: Write workflow recovery checkpoint
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          state=failed
          case "$CONCLUSION" in
            success) state=succeeded ;;
            cancelled) state=paused ;;
            failure|timed_out|action_required|startup_failure) state=failed ;;
            *) state=paused ;;
          esac
          python scripts/write_recovery_checkpoint.py \
            --workflow "$WORKFLOW_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --idempotency-key "workflow-run:$WORKFLOW_RUN_ID" \
            --checkpoint "workflow-completed" \
            --state "$state" \
            --detail "workflow run $WORKFLOW_RUN_ID completed with conclusion: $CONCLUSION" \
            --output artifacts/recovery/checkpoints
      - name: Write stage-level recovery checkpoints
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python scripts/generate_stage_checkpoints.py \
            --jobs artifacts/recovery/producer-jobs.json \
            --workflow "$WORKFLOW_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$WORKFLOW_RUN_ID" \
            --output artifacts/recovery/checkpoints
      - name: Validate checkpoint JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('artifacts/recovery/checkpoints').glob('*.json'))
          if len(files) < 2:
              raise SystemExit(f'expected workflow plus stage checkpoints, found {len(files)}')
          payloads = [json.loads(p.read_text(encoding='utf-8')) for p in files]
          required = {'schema_version', 'checkpoint_id', 'workflow', 'source_commit', 'idempotency_key', 'checkpoint', 'state', 'updated_at_utc'}
          for data in payloads:
              missing = required - data.keys()
              if missing:
                  raise SystemExit(f'checkpoint missing fields: {sorted(missing)}')
              if data['schema_version'] != 2:
                  raise SystemExit('checkpoint schema_version must be 2')
              if len(data['source_commit']) != 40:
                  raise SystemExit('checkpoint source_commit must be a git SHA')
          stage_files = [p for p in payloads if str(p['checkpoint']).startswith('stage-')]
          if not stage_files:
              raise SystemExit('no stage-level checkpoints were generated')
          if len({p['checkpoint_id'] for p in payloads}) != len(payloads):
              raise SystemExit('checkpoint IDs must be unique')
          print(f'Recovery checkpoint contract OK: {len(payloads)} checkpoints, {len(stage_files)} stages')
          PY
      - name: Generate deterministic replay manifest
        run: |
          set -euo pipefail
          python scripts/generate_replay_manifest.py \
            --input artifacts/recovery/checkpoints/*.json \
            --output artifacts/recovery/replay-manifest.json
      - name: Validate replay manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path('artifacts/recovery/replay-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          digest = data.pop('manifest_sha256', None)
          canonical = json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          if digest != hashlib.sha256(canonical).hexdigest():
              raise SystemExit('replay manifest checksum mismatch')
          if data['checkpoint_count'] < 2:
              raise SystemExit('replay manifest lacks stage-level checkpoints')
          if not data['trusted_successful_stages']:
              raise SystemExit('replay manifest has no trusted successful stage information')
          if not data['next_action']:
              raise SystemExit('replay manifest next_action is empty')
          print('Replay manifest contract OK:', data['next_action'])
          print('Last trusted stage:', data['last_trusted_stage'])
          PY
      - name: Upload recovery checkpoint and replay plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-checkpoint-${{ github.event.workflow_run.id }}
          path: |
            artifacts/recovery/checkpoints/*.json
            artifacts/recovery/replay-manifest.json
          if-no-files-found: error
          retention-days: 30
