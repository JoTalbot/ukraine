name: Release Control Plane Dispatch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-when-release-is-complete:
    runs-on: ubuntu-24.04
    steps:
      - name: Check producer completion and dispatch control plane
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['REPOSITORY']
          release = os.environ['RELEASE_COMMIT']
          required = {
              'ingestion': ['Ukraine Open Data Discovery'],
              'quality': ['Ukraine data CI'],
              'graph': ['Entity Graph Build'],
              'training': ['Train Ukraine Models', 'Kaggle GPU Training'],
              'publication': [
                  'Ukraine Open Data -> Hugging Face',
                  'Discovered Ukraine Open Data -> Hugging Face',
                  'EDRSR Hugging Face Upload',
                  'EDRSR Full Texts',
                  'Pages Dashboard',
              ],
              'security': ['Security scan'],
          }

          runs = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/actions/runs?head_sha={release}&per_page=100'
          ], text=True))['workflow_runs']
          successful = [
              r for r in runs
              if r.get('head_sha') == release and r.get('conclusion') == 'success'
          ]

          missing = []
          for group, names in required.items():
              if not any(r.get('name') in names for r in successful):
                  missing.append(group)

          if missing:
              print(f'Release {release} is not complete yet; missing successful groups: {", ".join(missing)}')
              raise SystemExit(0)

          print(f'Release {release} has all producer signals. Dispatching Release Control Plane.')
          subprocess.run([
              'gh', 'workflow', 'run', 'release-control-plane.yml',
              '--ref', 'main',
          ], check=True)
          PY
