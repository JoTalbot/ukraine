name: Release Control Plane Dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch-when-release-is-complete:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select release and dispatch missing producers or control plane
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_sha = os.environ.get('GITHUB_SHA')
          event_name = os.environ.get('GITHUB_EVENT_NAME')
          api_base = f'https://api.github.com/repos/{repo}'
          required = {
              'ingestion': ['Ukraine Open Data Discovery'],
              'quality': ['Ukraine data CI'],
              'graph': ['Entity Graph Build'],
              'training': ['Train Ukraine Models', 'Kaggle GPU Training'],
              'publication': [
                  'Ukraine Open Data -> Hugging Face',
                  'Discovered Ukraine Open Data -> Hugging Face',
                  'EDRSR Hugging Face Upload',
                  'EDRSR Full Texts',
              ],
              'security': ['Security scan'],
          }
          dispatchable = {
              'Ukraine Open Data Discovery': 'data-gov-discovery.yml',
              'Entity Graph Build': 'entity-graph.yml',
              'Train Ukraine Models': 'train-models.yml',
              'Kaggle GPU Training': 'kaggle-training.yml',
              'Ukraine Open Data -> Hugging Face': 'open-data-huggingface.yml',
              'Discovered Ukraine Open Data -> Hugging Face': 'discovered-open-data-huggingface.yml',
              'EDRSR Hugging Face Upload': 'edrsr-huggingface.yml',
              'EDRSR Full Texts': 'edrsr-texts.yml',
              'Security scan': 'security-scan.yml',
          }

          def request(path, method='GET', payload=None):
              req = urllib.request.Request(
                  api_base + '/' + path.lstrip('/'),
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return response.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {path} failed: HTTP {exc.code}: {body}') from exc

          def api(path):
              return request(path)[1]

          def ensure_release_ref(release):
              branch = f'release-candidate/{release}'
              ref_path = f'/git/ref/heads/{branch}'
              try:
                  _, existing = request(ref_path)
              except RuntimeError as exc:
                  if 'HTTP 404' not in str(exc):
                      raise
                  _, created = request('/git/refs', method='POST', payload={
                      'ref': f'refs/heads/{branch}',
                      'sha': release,
                  })
                  actual = created.get('object', {}).get('sha') if created else None
                  if actual != release:
                      raise RuntimeError(f'created release ref {branch} points to {actual}, expected {release}')
                  print(f'Created immutable release ref {branch} -> {release}')
                  return branch
              actual = existing.get('object', {}).get('sha') if existing else None
              if actual == release:
                  print(f'Reusing verified release ref {branch} -> {release}')
                  return branch
              repair_branch = f'release-candidate/{release}-repair'
              repair_path = f'/git/ref/heads/{repair_branch}'
              try:
                  _, repair_existing = request(repair_path)
                  repair_actual = repair_existing.get('object', {}).get('sha') if repair_existing else None
                  if repair_actual != release:
                      raise RuntimeError(
                          f'release ref {branch} is stale at {actual}; repair ref {repair_branch} already exists at {repair_actual}'
                      )
                  print(f'Reusing verified repair release ref {repair_branch} -> {release}')
                  return repair_branch
              except RuntimeError as repair_exc:
                  if 'HTTP 404' not in str(repair_exc):
                      raise
              _, created = request('/git/refs', method='POST', payload={
                  'ref': f'refs/heads/{repair_branch}',
                  'sha': release,
              })
              created_actual = created.get('object', {}).get('sha') if created else None
              if created_actual != release:
                  raise RuntimeError(
                      f'created repair release ref {repair_branch} points to {created_actual}, expected {release}'
                  )
              print(f'Stale release ref {branch} remains untouched at {actual}; created immutable repair ref {repair_branch} -> {release}')
              return repair_branch

          def dispatch(name, ref):
              workflow = dispatchable[name]
              url_path = f'/actions/workflows/{workflow}/dispatches'
              print(f'Dispatching {name} from immutable release ref {ref} via {workflow}')
              request(url_path, method='POST', payload={'ref': ref})

          quality_runs = api('/actions/workflows/ukraine-data-ci.yml/runs?status=success&branch=main&per_page=50')['workflow_runs']
          control_runs = api('/actions/workflows/release-control-plane.yml/runs?per_page=100')['workflow_runs']

          def candidate_priority(run):
              release = run.get('head_sha')
              return (
                  0 if release and release == current_sha else 1,
                  run.get('created_at') or '',
              )

          # A push/workflow_dispatch must never fall back to an older candidate: that can
          # starve the just-created main revision. Scheduled recovery may process older
          # successful candidates when no current candidate exists.
          candidates = sorted(quality_runs, key=candidate_priority)
          if event_name in {'push', 'workflow_dispatch'}:
              candidates = [r for r in candidates if r.get('head_sha') == current_sha]

          for quality in candidates:
              release = quality.get('head_sha')
              if not release:
                  continue
              runs = api(f'/actions/runs?head_sha={release}&per_page=100')['workflow_runs']
              successful = [r for r in runs if r.get('head_sha') == release and r.get('conclusion') == 'success']
              missing = [group for group, names in required.items() if not any(r.get('name') in names for r in successful)]
              if not missing:
                  marker = f'Release Control Plane • {release}'
                  already = [r for r in control_runs if r.get('event') == 'workflow_dispatch' and r.get('display_title') == marker and r.get('status') in {'queued', 'in_progress'}]
                  completed = [r for r in control_runs if r.get('event') == 'workflow_dispatch' and r.get('display_title') == marker and r.get('conclusion') in {'success', 'failure', 'cancelled'}]
                  if already or completed:
                      print(f'Control Plane already scheduled/processed release {release}; nothing to dispatch.')
                      raise SystemExit(0)
                  print(f'Release {release} is complete; dispatching Release Control Plane.')
                  request('/actions/workflows/release-control-plane.yml/dispatches', method='POST', payload={'ref': 'main', 'inputs': {'source_commit': release}})
                  raise SystemExit(0)

              print(f'Candidate {release} ({quality.get("run_number")}) incomplete: {", ".join(missing)}')
              release_ref = ensure_release_ref(release)
              for group in missing:
                  names = ['Kaggle GPU Training', 'Train Ukraine Models'] if group == 'training' else required[group]
                  for name in names:
                      if name not in dispatchable:
                          continue
                      existing = [r for r in runs if r.get('head_sha') == release and r.get('name') == name and r.get('status') in {'queued', 'in_progress'}]
                      if existing:
                          print(f'{name} already queued/running for {release}')
                          break
                      dispatch(name, release_ref)
                      break
              raise SystemExit(0)

          print(f'No successful quality release candidate for current revision {current_sha}; nothing to dispatch.')
          PY
