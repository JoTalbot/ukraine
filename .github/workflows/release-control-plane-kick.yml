name: Release Control Plane Kick

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for gh workflow dispatch
        uses: actions/checkout@v5
      - name: Dispatch canonical release-control-plane dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run .github/workflows/release-control-plane-dispatch.yml --ref main
