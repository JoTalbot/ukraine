name: Release Control Plane Kick

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical release-control-plane dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/release-control-plane-dispatch.yml/dispatches'
          request = urllib.request.Request(
              url,
              data=json.dumps({'ref': 'main'}).encode(),
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status not in (201, 204):
                  raise RuntimeError(f'dispatch returned HTTP {response.status}')
          print('Release Control Plane Dispatch queued successfully via Actions API.')
          PY
