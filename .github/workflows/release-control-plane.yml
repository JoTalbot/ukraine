name: Release Control Plane

run-name: Release Control Plane • ${{ inputs.source_commit || github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - Entity Graph Build
      - Ukraine Open Data Discovery
      - Ukraine data CI
      - Train Ukraine Models
      - Kaggle GPU Training
      - Ukraine Open Data -> Hugging Face
      - Discovered Ukraine Open Data -> Hugging Face
      - EDRSR Hugging Face Upload
      - EDRSR Full Texts
      - Security scan
      - Production Promotion Authorization
    types: [completed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact release commit SHA to aggregate
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  aggregate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.source_commit || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install control-plane dependencies from deterministic lock
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Download authoritative promotion authorization
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Production Promotion Authorization' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/status
          tmp_dir="$(mktemp -d)"
          gh run download "$RUN_ID" --name production-promotion-authorization --dir "$tmp_dir"
          test -s "$tmp_dir/promotion-authorization/production-promotion-authorization.json"
          cp "$tmp_dir/promotion-authorization/production-promotion-authorization.json" artifacts/status/production-promotion-authorization.json
          ARTIFACT_PATH="$(python -c 'import json; print(json.load(open("artifacts/status/production-promotion-authorization.json"))["artifact_path"])')"
          EVALUATION_PATH="$(python -c 'import json; print(json.load(open("artifacts/status/production-promotion-authorization.json"))["evaluation_evidence_path"])')"
          test -s "$tmp_dir/$ARTIFACT_PATH"
          test -s "$tmp_dir/$EVALUATION_PATH"
          mkdir -p "$(dirname "$ARTIFACT_PATH")" "$(dirname "$EVALUATION_PATH")"
          cp "$tmp_dir/$ARTIFACT_PATH" "$ARTIFACT_PATH"
          cp "$tmp_dir/$EVALUATION_PATH" "$EVALUATION_PATH"
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("artifacts/status/production-promotion-authorization.json"))["source_commit"])')"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Determine release source commit
        env:
          PROMOTION_SOURCE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Production Promotion Authorization' }}
        run: |
          set -euo pipefail
          if [ "$PROMOTION_SOURCE" = "true" ]; then
            test -s artifacts/status/production-promotion-authorization.json
            python - <<'PY'
import json
import subprocess
from pathlib import Path
source = json.loads(Path('artifacts/status/production-promotion-authorization.json').read_text())['source_commit']
head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
if source != head:
    raise SystemExit('promotion authorization source_commit does not match checked out release')
PY
          else
            test "${{ github.event.inputs.source_commit || github.event.workflow_run.head_sha || github.sha }}" = "$(git rev-parse HEAD)"
          fi
      - name: Collect all producer signals for exact release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.inputs.source_commit || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/status/signals
          python - <<'PY'
import json
import os
import subprocess
from pathlib import Path
repo = os.environ['REPOSITORY']
release = os.environ['RELEASE_COMMIT']
auth = Path('artifacts/status/production-promotion-authorization.json')
if auth.is_file():
    release = json.loads(auth.read_text())['source_commit']
if not release:
    raise SystemExit('unable to determine release commit')
groups = {
    'ingestion': ['Ukraine Open Data Discovery'],
    'quality': ['Ukraine data CI'],
    'graph': ['Entity Graph Build'],
    'training': ['Train Ukraine Models', 'Kaggle GPU Training'],
    'publication': ['Ukraine Open Data -> Hugging Face', 'Discovered Ukraine Open Data -> Hugging Face', 'EDRSR Hugging Face Upload', 'EDRSR Full Texts'],
    'security': ['Security scan'],
}
runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs?head_sha={release}&per_page=100'], text=True))['workflow_runs']
runs = [r for r in runs if r.get('head_sha') == release and r.get('conclusion') == 'success']
for signal, names in groups.items():
    candidates = [r for r in runs if r.get('name') in names]
    candidates.sort(key=lambda r: r.get('run_number', 0), reverse=True)
    if not candidates:
        raise SystemExit(f'missing successful producer run for {signal} at {release}')
    selected = candidates[0]
    artifact_name = f'status-signal-{signal}'
    target = Path('artifacts/status/signals') / signal
    target.mkdir(parents=True, exist_ok=True)
    subprocess.run(['gh', 'run', 'download', str(selected['id']), '--name', artifact_name, '--dir', str(target)], check=True)
    signal_file = target / f'{signal}.json'
    if not signal_file.is_file() or signal_file.stat().st_size == 0:
        raise SystemExit(f'{artifact_name} from run {selected["id"]} did not contain {signal}.json')
    payload = json.loads(signal_file.read_text())
    if payload.get('source_commit', payload.get('git_commit')) != release:
        raise SystemExit(f'{signal} signal source commit mismatch')
    print(f'Using {signal} from run {selected["id"]} ({selected["name"]})')
Path('artifacts/status/release-source-commit.txt').write_text(release + '\n', encoding='utf-8')
PY
          for signal in ingestion quality graph training publication security; do
            cp "artifacts/status/signals/$signal/$signal.json" "artifacts/status/signals/$signal.json"
          done
      - name: Generate release manifest
        run: python scripts/generate_release_manifest.py --output artifacts/status/release-manifest.json
      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/status/sbom.cdx.json
      - name: Aggregate canonical status index
        run: python scripts/aggregate_status_signals.py --manifest artifacts/status/release-manifest.json --signals-dir artifacts/status/signals --sbom artifacts/status/sbom.cdx.json --output artifacts/status/status-index.json
      - name: Validate canonical control plane
        run: python scripts/validate_release.py
      - name: Execute runtime hardening evidence self-test
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python scripts/production_hardening.py evidence artifacts/status/production-hardening-evidence.json "$SOURCE_COMMIT" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID"
      - name: Upload pre-gate diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-control-plane-pre-gate
          path: artifacts/status/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify authoritative promotion authorization
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Production Promotion Authorization' }}
        run: python scripts/verify_promotion_authorization.py --output artifacts/status/promotion-authorization-verification.json
      - name: Verify cryptographic artifact chain
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Production Promotion Authorization' }}
        run: python scripts/verify_artifact_chain.py --output artifacts/status/artifact-chain.json
      - name: Evaluate production readiness
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Production Promotion Authorization' }}
        run: python scripts/check_production_readiness.py --output artifacts/status/production-readiness.json
      - name: Upload canonical control-plane snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-control-plane
          path: artifacts/status/*.json
          if-no-files-found: error
          retention-days: 30
