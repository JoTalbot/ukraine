name: Release Control Plane

on:
  workflow_run:
    workflows:
      - Entity Graph Build
      - Ukraine Open Data Discovery
      - Ukraine data CI
      - Train Ukraine Models
      - Kaggle GPU Training
      - Ukraine Open Data -> Hugging Face
      - Discovered Ukraine Open Data -> Hugging Face
      - EDRSR Hugging Face Upload
      - EDRSR Full Texts
      - Pages Dashboard
      - Kaggle Kernel Results
      - Security scan
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  aggregate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install control-plane dependencies from deterministic lock
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Generate release manifest
        run: python scripts/generate_release_manifest.py --output artifacts/status/release-manifest.json
      - name: Resolve producer identity
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_NAME" in
            "Entity Graph Build") echo 'SIGNAL=graph' >> "$GITHUB_ENV" ;;
            "Ukraine data CI") echo 'SIGNAL=quality' >> "$GITHUB_ENV" ;;
            "Ukraine Open Data Discovery") echo 'SIGNAL=ingestion' >> "$GITHUB_ENV" ;;
            "Train Ukraine Models"|"Kaggle GPU Training") echo 'SIGNAL=training' >> "$GITHUB_ENV" ;;
            "Ukraine Open Data -> Hugging Face"|"Discovered Ukraine Open Data -> Hugging Face"|"EDRSR Hugging Face Upload"|"EDRSR Full Texts"|"Pages Dashboard"|"Kaggle Kernel Results") echo 'SIGNAL=publication' >> "$GITHUB_ENV" ;;
            "Security scan") echo 'SIGNAL=security' >> "$GITHUB_ENV" ;;
            *) echo "Unsupported workflow: $WORKFLOW_NAME" >&2; exit 1 ;;
          esac
      - name: Download producer signal
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SIGNAL: ${{ env.SIGNAL }}
        run: |
          set -euo pipefail
          rm -rf artifacts/status/signals
          mkdir -p artifacts/status/signals
          if ! gh run download "$RUN_ID" --name "status-signal-$SIGNAL" --dir artifacts/status/signals >/dev/null 2>&1; then
            echo "Required producer signal artifact status-signal-$SIGNAL is missing" >&2
            exit 1
          fi
          test -s "artifacts/status/signals/$SIGNAL.json"
          echo "Using producer signal artifact for $SIGNAL"
      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/status/sbom.cdx.json
      - name: Aggregate canonical status index
        run: python scripts/aggregate_status_signals.py --manifest artifacts/status/release-manifest.json --signals-dir artifacts/status/signals --sbom artifacts/status/sbom.cdx.json --output artifacts/status/status-index.json
      - name: Validate canonical control plane
        run: python scripts/validate_release.py
      - name: Execute runtime hardening evidence self-test
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python scripts/production_hardening.py evidence artifacts/status/production-hardening-evidence.json "$SOURCE_COMMIT" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID"
      - name: Evaluate production readiness
        run: python scripts/check_production_readiness.py --output artifacts/status/production-readiness.json
      - name: Upload canonical control-plane snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-control-plane
          path: artifacts/status/*.json
          if-no-files-found: error
          retention-days: 30
