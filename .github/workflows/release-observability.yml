name: Release observability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RELEASE_ARTIFACT_NAME: release-manifest-observability

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install CI dependencies from deterministic lock
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Generate release manifest
        run: python scripts/generate_release_manifest.py --output artifacts/status/release-manifest.json
      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/status/sbom.cdx.json
      - name: Generate canonical status index
        run: python scripts/generate_status_index.py --root . --output artifacts/status/status-index.json --sbom artifacts/status/sbom.cdx.json
      - name: Validate release and status contract
        run: python scripts/validate_release.py
      - name: Verify reproducibility against previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-release
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == env.RELEASE_ARTIFACT_NAME and .expired == false and .workflow_run.head_sha == env.GITHUB_SHA)) | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No previous snapshot for this commit; reproducibility baseline not yet available."
          else
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/previous-release/snapshot.zip
            unzip -q /tmp/previous-release/snapshot.zip -d /tmp/previous-release
            previous="$(find /tmp/previous-release -name release-manifest.json -type f | head -n 1)"
            test -n "$previous" && test -f "$previous"
            python scripts/validate_release.py --compare-manifests "$previous" artifacts/status/release-manifest.json
          fi
      - name: Evaluate production readiness
        run: python scripts/check_production_readiness.py --output artifacts/status/production-readiness.json
      - name: Run release contract tests
        run: python -m pytest tests/test_release_contract.py tests/test_release_manifest.py tests/test_status_index.py tests/test_write_status_signal.py tests/test_aggregate_status_signals.py tests/test_recovery_checkpoint.py tests/test_production_readiness.py -q
      - name: Upload release observability snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-manifest-observability
          path: artifacts/status/*.json
          if-no-files-found: error
          retention-days: 7
