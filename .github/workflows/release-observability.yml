name: Release observability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt
      - name: Validate release contract
        run: python scripts/validate_release.py
      - name: Run release contract tests
        run: python -m pytest tests/test_release_contract.py -q
