name: Release Trigger Recovery

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Kaggle Kernel Results
      - Kaggle GPU Training
      - Entity Graph Build
      - Train Ukraine Models
      - Ukraine Open Data Discovery
      - Ukraine Open Data -> Hugging Face
      - Discovered Ukraine Open Data -> Hugging Face
      - EDRSR Hugging Face Upload
      - EDRSR Full Texts
      - Security scan
      - Ukraine data CI
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recover-release-trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger quality or control-plane progression
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          event_name = os.environ['EVENT_NAME']
          workflow_name = os.environ.get('WORKFLOW_NAME', '')
          api = f'https://api.github.com/repos/{repo}'

          def request(path, method='GET', payload=None):
              req = urllib.request.Request(
                  api + '/' + path.lstrip('/'),
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return response.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {path} failed: HTTP {exc.code}: {body}') from exc

          def active_runs(workflow_file):
              _, payload = request(f'/actions/workflows/{workflow_file}/runs?branch=main&per_page=20')
              return [
                  r for r in payload.get('workflow_runs', [])
                  if r.get('status') in {'queued', 'in_progress'}
              ]

          if event_name == 'workflow_run' and workflow_name == 'Ukraine data CI':
              if active_runs('release-control-plane-dispatch.yml'):
                  print('Release Control Plane Dispatch is already active; no duplicate trigger.')
              else:
                  print('Ukraine data CI completed; triggering Release Control Plane Dispatch.')
                  request('/actions/workflows/release-control-plane-dispatch.yml/dispatches', method='POST', payload={'ref': 'main'})
              raise SystemExit(0)

          if active_runs('ukraine-data-ci.yml'):
              print('Ukraine data CI is already queued/running; no duplicate trigger.')
              raise SystemExit(0)

          print(f'Event {event_name} / {workflow_name}: triggering Ukraine data CI for current main revision.')
          request('/actions/workflows/ukraine-data-ci.yml/dispatches', method='POST', payload={'ref': 'main'})
          PY
