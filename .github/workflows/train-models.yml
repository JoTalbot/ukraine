name: Train Ukraine Models

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Training steps'
        required: true
        default: '600'
  # Scheduled cadence only. Retraining after every EDRSR upload (every 30 min)
  # saturated the runner queue and starved other workflows — new data lands in
  # the corpus anyway on the next scheduled pass.
  schedule:
    - cron: '40 3,15 * * *'

permissions:
  contents: write

concurrency:
  group: ukraine-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_EDRSR_REPO: JoTalbot/ua-edrsr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tokenizers pyarrow numpy

      - name: Download EDRSR sample (public Parquet parts)
        run: |
          mkdir -p artifacts/lm-src
          curl -sL "https://huggingface.co/datasets/${{ env.HF_EDRSR_REPO }}/resolve/main/2026/part-00000.parquet" -o artifacts/lm-src/part-00000.parquet
          curl -sL "https://huggingface.co/datasets/${{ env.HF_EDRSR_REPO }}/resolve/main/2026/part-00001.parquet" -o artifacts/lm-src/part-00001.parquet
          ls -la artifacts/lm-src

      - name: Build Ukrainian legal corpus
        run: |
          python scripts/build_lm_corpus.py \
            --edrsr-parquet 'artifacts/lm-src/part-*.parquet' \
            --edrsr-limit 400000 \
            --output artifacts/lm/corpus.txt

      - name: Train legal LM (CPU)
        run: |
          python scripts/train_lm.py \
            --corpus artifacts/lm/corpus.txt \
            --out artifacts/lm/model \
            --steps ${{ inputs.steps || '600' }} \
            --dim 256 --layers 6 --ctx 256 --batch 8 \
            --eval-every 150 --sample-every 300

      - name: Show samples
        run: cat artifacts/lm/model/samples.txt

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: ua-legal-lm
          path: |
            artifacts/lm/model/model.pt
            artifacts/lm/model/tokenizer.json
            artifacts/lm/model/metrics.jsonl
            artifacts/lm/model/samples.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish model to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: JoTalbot/ua-legal-lm
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN secret is missing; skipping publish'; exit 0; }
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import datetime, json, math, os
          from pathlib import Path
          from huggingface_hub import HfApi

          repo = os.environ['HF_MODEL_REPO']
          root = Path('artifacts/lm/model')
          metrics = [json.loads(l) for l in (root / 'metrics.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]
          val = [m for m in metrics if 'val_loss' in m]
          train = [m for m in metrics if 'loss' in m]
          last_val = val[-1]['val_loss'] if val else None
          last_step = max((m.get('step', 0) for m in metrics), default=0)
          ppl = round(math.exp(last_val), 1) if last_val else None

          card_lines = [
              '---',
              'language: uk',
              'tags:',
              '- legal',
              '- ukraine',
              '- ukrainian',
              '- from-scratch',
              '- open-data',
              'datasets:',
              '- JoTalbot/ua-edrsr',
              '- JoTalbot/ua-open-data',
              '---',
              '',
              '# ua-legal-lm — українська legal-LM, навчана з нуля',
              '',
              'Модель GPT (PyTorch) навчена виключно на відкритих даних України:',
              'метадані судових рішень ЄДРСР, ЄДР (компанії, засновники, статути), реєстр платників ПДВ.',
              '',
              '- Джерело пайплайну: [JoTalbot/ukraine](https://github.com/JoTalbot/ukraine)',
              f'- Кроків навчання: {last_step}',
              f'- Val loss: {last_val} (perplexity ≈ {ppl})',
              f'- Дата: {datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}',
              '',
              'Файли: `model.pt` (state_dict + config), `tokenizer.json` (BPE), `metrics.jsonl`, `samples.txt`.',
              '',
              'Приватність: лише законно опубліковані відкриті дані; знеособлення джерела збережено.',
              '',
          ]
          Path('MODEL_CARD.md').write_text('\n'.join(card_lines), encoding='utf-8')

          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(repo_id=repo, repo_type='model', exist_ok=True, private=False)
          api.update_repo_settings(repo_id=repo, repo_type='model', private=False)
          api.upload_file(path_or_fileobj='MODEL_CARD.md', path_in_repo='README.md', repo_id=repo, repo_type='model')
          for name in ('model.pt', 'tokenizer.json', 'metrics.jsonl', 'samples.txt'):
              api.upload_file(path_or_fileobj=str(root / name), path_in_repo=name, repo_id=repo, repo_type='model')
          print('Published model to', repo, '| val_loss:', last_val)
          PY

      - name: Persist training metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .training-manifests/legal-lm
          cp artifacts/lm/model/metrics.jsonl .training-manifests/legal-lm/ 2>/dev/null || true
          cp artifacts/lm/model/samples.txt .training-manifests/legal-lm/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .training-manifests/legal-lm
          if git diff --cached --quiet; then
            echo 'No metric changes.'
          else
            git commit -m "chore: update legal-lm training metrics"
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            echo 'Failed to push metrics after retries' >&2
            exit 1
          fi
