name: Train Ukraine Models

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Training steps'
        required: true
        default: '600'
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ['EDRSR Hugging Face Upload']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ukraine-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      HF_EDRSR_REPO: JoTalbot/ua-edrsr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tokenizers pyarrow numpy

      - name: Download EDRSR sample (public Parquet parts)
        run: |
          mkdir -p artifacts/lm-src
          curl -sL "https://huggingface.co/datasets/${{ env.HF_EDRSR_REPO }}/resolve/main/2026/part-00000.parquet" -o artifacts/lm-src/part-00000.parquet
          curl -sL "https://huggingface.co/datasets/${{ env.HF_EDRSR_REPO }}/resolve/main/2026/part-00001.parquet" -o artifacts/lm-src/part-00001.parquet
          ls -la artifacts/lm-src

      - name: Build Ukrainian legal corpus
        run: |
          python scripts/build_lm_corpus.py \
            --edrsr-parquet 'artifacts/lm-src/part-*.parquet' \
            --edrsr-limit 400000 \
            --output artifacts/lm/corpus.txt

      - name: Train legal LM (CPU)
        run: |
          python scripts/train_lm.py \
            --corpus artifacts/lm/corpus.txt \
            --out artifacts/lm/model \
            --steps ${{ inputs.steps || '600' }} \
            --dim 256 --layers 6 --ctx 256 --batch 8 \
            --eval-every 150 --sample-every 300

      - name: Show samples
        run: cat artifacts/lm/model/samples.txt

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-legal-lm
          path: |
            artifacts/lm/model/model.pt
            artifacts/lm/model/tokenizer.json
            artifacts/lm/model/metrics.jsonl
            artifacts/lm/model/samples.txt
          retention-days: 30
          if-no-files-found: error

      - name: Persist training metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .training-manifests/legal-lm
          cp artifacts/lm/model/metrics.jsonl .training-manifests/legal-lm/ 2>/dev/null || true
          cp artifacts/lm/model/samples.txt .training-manifests/legal-lm/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .training-manifests/legal-lm
          if git diff --cached --quiet; then
            echo 'No metric changes.'
          else
            git commit -m "chore: update legal-lm training metrics"
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            echo 'Failed to push metrics after retries' >&2
            exit 1
          fi
