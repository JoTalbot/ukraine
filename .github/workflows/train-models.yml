name: Train Ukraine Models

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Training mode'
        required: true
        default: 'all'
        type: choice
        options: [all, court, registry, procurement, government, embeddings]
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ['EDRSR Hugging Face Upload']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ukraine-model-training
  cancel-in-progress: false

env:
  HF_EDRSR_REPO: JoTalbot/ua-edrsr
  HF_OPEN_DATA_REPO: JoTalbot/ua-open-data

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        shell: bash
        run: echo "mode=${{ inputs.mode || 'all' }}" >> "$GITHUB_OUTPUT"

  train:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [court, registry, procurement, government, embeddings]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets huggingface_hub pyarrow transformers sentence-transformers accelerate

      - name: Prepare public-data training corpus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_KIND: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/training/$MODEL_KIND"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import HfApi

          out = Path('artifacts/training') / os.environ['MODEL_KIND']
          api = HfApi(token=os.environ['HF_TOKEN'])
          manifest = []
          for repo in [os.environ['HF_EDRSR_REPO'], os.environ['HF_OPEN_DATA_REPO']]:
              try:
                  info = api.dataset_info(repo_id=repo)
                  for item in info.siblings or []:
                      manifest.append({'repo': repo, 'path': item.rfilename})
              except Exception as exc:
                  print(f'WARN: cannot inspect {repo}: {exc}')
          (out / 'source_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          print(f"{os.environ['MODEL_KIND']}: {len(manifest)} source files discovered")
          PY

      - name: Build reproducible training manifest
        env:
          MODEL_KIND: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/training') / os.environ['MODEL_KIND']
          manifest = json.loads((root / 'source_manifest.json').read_text())
          meta = {
              'model_kind': os.environ['MODEL_KIND'],
              'source_files': len(manifest),
              'training_status': 'corpus_manifest_ready',
              'gpu_backend': 'kaggle_notebook',
              'privacy_scope': 'public_open_data_only',
              'deanonymization': False,
          }
          (root / 'training_manifest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-${{ matrix.model }}
          path: artifacts/training/${{ matrix.model }}
          retention-days: 30

      - name: Persist manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .training-manifests/${{ matrix.model }}
          cp artifacts/training/${{ matrix.model }}/source_manifest.json .training-manifests/${{ matrix.model }}/
          cp artifacts/training/${{ matrix.model }}/training_manifest.json .training-manifests/${{ matrix.model }}/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .training-manifests/${{ matrix.model }}
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
          else
            git commit -m "chore: update ${{ matrix.model }} training manifests"
            git push
          fi
