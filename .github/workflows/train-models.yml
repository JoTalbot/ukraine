name: Train Ukraine Models

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Training mode'
        required: true
        default: 'all'
        type: choice
        options: [all, court, registry, procurement, government, embeddings]
  schedule:
    - cron: '15 */6 * * *'
  workflow_run:
    workflows: ['EDRSR Hugging Face Upload']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ukraine-model-training
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        shell: bash
        run: echo "mode=${{ inputs.mode || 'all' }}" >> "$GITHUB_OUTPUT"

  train:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [court, registry, procurement, government, embeddings]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets huggingface_hub pyarrow transformers sentence-transformers accelerate

      - name: Prepare public-data training corpus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_EDRSR_REPO: JoTalbot/ua-edrsr
          HF_OPEN_DATA_REPO: JoTalbot/ua-open-data
          MODEL_KIND: ${{ matrix.model }}
        run: |
          mkdir -p artifacts/training/$MODEL_KIND
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          out = Path('artifacts/training') / os.environ['MODEL_KIND']
          out.mkdir(parents=True, exist_ok=True)
          api = HfApi(token=os.environ['HF_TOKEN'])
          repos = [os.environ['HF_EDRSR_REPO'], os.environ['HF_OPEN_DATA_REPO']]
          manifest = []
          for repo in repos:
              try:
                  info = api.dataset_info(repo_id=repo)
                  for item in info.siblings or []:
                      manifest.append({'repo': repo, 'path': item.rfilename})
              except Exception as exc:
                  print(f'WARN: cannot inspect {repo}: {exc}')
          (out / 'source_manifest.json').write_text(__import__('json').dumps(manifest, ensure_ascii=False, indent=2))
          print(f'{os.environ["MODEL_KIND"]}: {len(manifest)} source files discovered')
          PY

      - name: Train or build model artifact
        env:
          MODEL_KIND: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          kind = os.environ['MODEL_KIND']
          root = Path('artifacts/training') / kind
          manifest = json.loads((root / 'source_manifest.json').read_text())
          # This stage deliberately builds a reproducible training manifest first.
          # Heavy fine-tuning is enabled only when a GPU runner is configured.
          meta = {
              'model_kind': kind,
              'source_files': len(manifest),
              'training_status': 'corpus_manifest_ready',
              'privacy_scope': 'public_open_data_only',
              'deanonymization': False,
          }
          (root / 'training_manifest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-${{ matrix.model }}
          path: artifacts/training/${{ matrix.model }}
          retention-days: 30
