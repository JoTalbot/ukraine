name: Ukraine data CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep release validation active after workflow-only repairs.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.lock -r requirements-ci.txt
      - name: Ruff lint
        run: ruff check --config ruff.toml scripts tests
      - name: Compile all Python sources
        run: python -m compileall scripts tests
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Verify entity graph provenance contract
        run: python -m pytest tests/test_entity_graph_provenance.py -q
      - name: Generate release manifest
