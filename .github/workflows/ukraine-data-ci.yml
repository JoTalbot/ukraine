name: Ukraine data CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep release validation active after workflow-only repairs.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.lock -r requirements-ci.txt
      - name: Ruff lint
        run: ruff check --config ruff.toml scripts tests
      - name: Compile all Python sources
        run: python -m compileall scripts tests
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Verify entity graph provenance contract
        run: python -m pytest tests/test_entity_graph_provenance.py -q
      - name: Generate release manifest
        run: python scripts/generate_release_manifest.py --output artifacts/status/release-manifest.json
      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/status/sbom.cdx.json
      - name: Generate platform status index
        run: python scripts/generate_status_index.py --output artifacts/status/status-index.json --sbom artifacts/status/sbom.cdx.json
      - name: Execute runtime hardening evidence self-test
        run: python scripts/production_hardening.py evidence artifacts/status/production-hardening-evidence.json "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID"
      - name: Bind release artifacts
        run: python scripts/bind_release_artifacts.py --manifest artifacts/status/release-manifest.json
      - name: Validate release and status contract
        run: python scripts/validate_release.py
      - name: Upload release validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-status
          path: |
            artifacts/status/release-manifest.json
            artifacts/status/sbom.cdx.json
            artifacts/status/status-index.json
            artifacts/status/production-hardening-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Write quality status signal
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          state=red
          if [ "$JOB_STATUS" = "success" ]; then state=green; fi
          detail="repository data quality/release validation completed with job status: $JOB_STATUS"
          python scripts/write_status_signal.py --signal quality --state "$state" --detail "$detail" --source-commit "$SOURCE_COMMIT" --workflow-name "$WORKFLOW_NAME" --workflow-run-id "$WORKFLOW_RUN_ID" --artifact artifacts/status/release-manifest.json
      - name: Upload quality status signal
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status-signal-quality
          path: artifacts/status/signals/quality.json
          if-no-files-found: error
          retention-days: 30
