target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF", "EXE", "BLE", "S", "FURB", "PLR0402"]
ignore = [
    "BLE001",       # best-effort пайплайны: осознанный blind-except с логированием
    "S110",         # try-except-pass в cleanup-ветках — намеренно
    "S310",         # код — загрузчик открытых данных по дизайну (http/https URL-источники)
    "S314",         # XML из официальных архивов data.gov.ua/ЄДРСР — доверенный источник
    "S607",         # subprocess-вызовы python/pip внутри Kaggle-кернелов
    "E701", "E702", # стиль проекта: компактные однострочники
    "RUF001", "RUF002", "RUF003",  # кириллица в строках — предметная область проекта
]

[lint.per-file-ignores]
"tests/*" = ["S101", "E402"]  # assert в тестах; importlib загрузка модулей под тестом
